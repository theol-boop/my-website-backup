<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tilt - Theo Lebeaux</title>
<style>
  :root { --ink: #000; --paper: #fff; --muted: #777; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); overflow: hidden;
    font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .corner { position: fixed; z-index: 2; }
  #back { top: 12px; left: 16px; color: var(--ink); text-decoration: none; }
  #back:hover { text-decoration: underline; }
  #help { bottom: 12px; left: 16px; color: var(--muted); pointer-events: none; }
  #help b { color: var(--ink); font-weight: normal; }
  #readout { bottom: 12px; right: 16px; text-align: right; color: var(--muted); white-space: pre; pointer-events: none; }
  #dial { width: 64px; height: 64px; display: block; margin: 0 0 6px auto; }
  @media (max-width: 700px) { #help { right: 16px; } #readout { bottom: auto; top: 44px; } }

  #panel { position: fixed; z-index: 3; top: 40px; right: 16px; width: 260px; max-width: calc(100vw - 32px);
    max-height: calc(100vh - 100px); overflow-y: auto; background: var(--paper); border: 1px solid var(--ink);
    padding: 10px 12px; box-sizing: border-box; }
  #panel[hidden] { display: none; }
  #panel h2 { font-size: 13px; font-weight: normal; margin: 0 0 8px; display: flex; justify-content: space-between; }
  #panel h3 { font-size: 11px; font-weight: normal; color: var(--muted); margin: 12px 0 4px; text-transform: uppercase; letter-spacing: .05em; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 0 8px; margin: 4px 0; }
  .row label { white-space: nowrap; }
  .row output { color: var(--muted); }
  .row input { grid-column: 1 / -1; width: 100%; margin: 2px 0 0; accent-color: var(--ink); }
  #panel button, #tune-btn { font: inherit; background: var(--paper); color: var(--ink); border: 1px solid var(--ink);
    padding: 3px 8px; cursor: pointer; }
  #panel button:hover, #tune-btn:hover { background: var(--ink); color: var(--paper); }
  #tune-btn { top: 12px; left: 50%; transform: translateX(-50%); }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.14.0/rapier.es.js"
  }
}
</script>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="loading">loading physics…</div>

  <a id="back" class="corner" href="projects.html">&#8249; back</a>
  <button id="tune-btn" class="corner" type="button">tune (T)</button>
  <div id="readout" class="corner"><canvas id="dial" width="64" height="64"></canvas><div id="readout-text"></div></div>
  <div id="help" class="corner">
    <b>WASD</b> roll &nbsp; <b>space</b> jump &nbsp; <b>Q/E</b> turn view &nbsp; <b>R</b> reset &nbsp; <b>T</b> tuning
  </div>

  <div id="panel" hidden>
    <h2><span>tuning</span><button id="panel-close" type="button" aria-label="Close">×</button></h2>
    <div id="sliders"></div>
    <p style="margin:12px 0 0; display:flex; flex-wrap:wrap; gap:6px;">
      <button id="reset-defaults" type="button">defaults</button>
      <button id="reset-ball" type="button">reset</button>
      <button id="level-platform" type="button">level platform</button>
    </p>
  </div>

  <!-- bump ?v= on every change to tilt.js so browsers never pair a new page with a cached old script -->
  <script type="module" src="tilt.js?v=3"></script>
</body>
</html>
