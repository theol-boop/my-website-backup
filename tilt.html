<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>tilt - Theo Lebeaux</title>
<style>
  :root { --ink: #000; --paper: #fff; --muted: #777; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); overflow: hidden;
    font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .corner { position: fixed; z-index: 2; }
  #back { top: 12px; left: 16px; color: var(--ink); text-decoration: none; }
  #back:hover { text-decoration: underline; }
  #help { bottom: 12px; left: 16px; color: var(--muted); pointer-events: none; }
  #help b { color: var(--ink); font-weight: normal; }
  #readout { bottom: 12px; right: 16px; text-align: right; color: var(--muted); white-space: pre; pointer-events: none; }
  #dial { width: 64px; height: 64px; display: block; margin: 0 0 6px auto; }
  #dial[hidden] { display: none; }
  #banner { position: fixed; z-index: 2; top: 56px; left: 50%; transform: translateX(-50%); max-width: calc(100vw - 32px);
    background: var(--paper); border: 1px solid var(--ink); padding: 6px 12px; text-align: center; }
  #banner[hidden] { display: none; }
  @media (max-width: 700px) { #help { right: 16px; } #readout { bottom: auto; top: 44px; } }

  #panel { position: fixed; z-index: 3; top: 40px; right: 16px; width: 260px; max-width: calc(100vw - 32px);
    max-height: calc(100vh - 100px); overflow-y: auto; background: var(--paper); border: 1px solid var(--ink);
    padding: 10px 12px; box-sizing: border-box; }
  #panel[hidden] { display: none; }
  #panel h2 { font-size: 13px; font-weight: normal; margin: 0 0 8px; display: flex; justify-content: space-between; }
  #panel h3 { font-size: 11px; font-weight: normal; color: var(--muted); margin: 12px 0 4px; text-transform: uppercase; letter-spacing: .05em; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 0 8px; margin: 4px 0; }
  .row label { white-space: nowrap; }
  .row output { color: var(--muted); }
  .row input { grid-column: 1 / -1; width: 100%; margin: 2px 0 0; accent-color: var(--ink); }
  #panel button, #tune-btn { font: inherit; background: var(--paper); color: var(--ink); border: 1px solid var(--ink);
    padding: 3px 8px; cursor: pointer; }
  #panel button:hover, #tune-btn:hover { background: var(--ink); color: var(--paper); }
  #tune-btn { top: 12px; left: 50%; transform: translateX(-50%); }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); }

  /* Touch controls: shown once the device is touch-first (body.touch) */
  #touch { display: none; }
  body.touch #touch { display: block; }
  body.touch #help { display: none; }
  body.touch #readout { bottom: auto; top: 44px; }
  #stick-zone { position: fixed; left: 0; top: 48px; bottom: 0; width: 55%; z-index: 1; touch-action: none; }
  #stick-base, #stick-knob { position: fixed; z-index: 2; border: 1px solid var(--ink); border-radius: 50%;
    pointer-events: none; transform: translate(-50%, -50%); }
  #stick-base { width: 120px; height: 120px; background: rgba(255,255,255,.6); }
  #stick-knob { width: 48px; height: 48px; background: var(--paper); }
  #stick-base[hidden], #stick-knob[hidden] { display: none; }
  #stick-hint { position: fixed; left: 16px; bottom: 16px; color: var(--muted); pointer-events: none; z-index: 1; }
  .tbtn { position: fixed; z-index: 2; font: inherit; background: var(--paper); color: var(--ink); border: 1px solid var(--ink);
    border-radius: 50%; display: grid; place-items: center; touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; padding: 0; }
  .tbtn.on { background: var(--ink); color: var(--paper); }
  #jump-btn { width: 84px; height: 84px; right: max(20px, env(safe-area-inset-right)); bottom: max(28px, env(safe-area-inset-bottom)); }
  #brake-btn { width: 64px; height: 64px; right: calc(max(20px, env(safe-area-inset-right)) + 100px); bottom: max(28px, env(safe-area-inset-bottom)); }
  #rotl-btn, #rotr-btn { width: 44px; height: 44px; bottom: calc(max(28px, env(safe-area-inset-bottom)) + 100px); font-size: 18px; }
  #rotr-btn { right: max(20px, env(safe-area-inset-right)); }
  #rotl-btn { right: calc(max(20px, env(safe-area-inset-right)) + 56px); }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.14.0/rapier.es.js",
    "tilt-params": "./tilt/params.js?v=11",
    "tilt-draw": "./tilt/draw.js?v=11",
    "tilt-pieces": "./tilt/pieces.js?v=11",
    "tilt-course": "./tilt/course.js?v=11"
  }
}
</script>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="loading">loading physics…</div>

  <a id="back" class="corner" href="projects.html">&#8249; back</a>
  <button id="tune-btn" class="corner" type="button">tune (T)</button>
  <div id="banner" hidden></div>
  <div id="readout" class="corner"><canvas id="dial" width="64" height="64"></canvas><div id="readout-text"></div></div>
  <div id="help" class="corner">
    <b>WASD/arrows</b> roll &nbsp; <b>space</b> jump &nbsp; <b>Q/E</b> turn view &nbsp; <b>shift</b> brake &nbsp; <b>C</b> last checkpoint &nbsp; <b>R</b> restart &nbsp; <b>T</b> tuning
  </div>

  <div id="touch">
    <div id="stick-zone"></div>
    <div id="stick-base" hidden></div><div id="stick-knob" hidden></div>
    <div id="stick-hint">drag here to roll</div>
    <button id="jump-btn" class="tbtn" type="button">jump</button>
    <button id="brake-btn" class="tbtn" type="button">brake</button>
    <button id="rotl-btn" class="tbtn" type="button" aria-label="Turn view left">&#8634;</button>
    <button id="rotr-btn" class="tbtn" type="button" aria-label="Turn view right">&#8635;</button>
  </div>

  <div id="panel" hidden>
    <h2><span>tuning</span><button id="panel-close" type="button" aria-label="Close">×</button></h2>
    <div id="sliders"></div>
    <p style="margin:12px 0 0; display:flex; flex-wrap:wrap; gap:6px;">
      <button id="reset-defaults" type="button">defaults</button>
      <button id="to-checkpoint" type="button">last checkpoint</button>
      <button id="restart" type="button">restart</button>
    </p>
  </div>

  <!-- bump every ?v= (here and in the import map) on each change, so browsers never mix new and cached old files -->
  <script type="module" src="tilt/main.js?v=11"></script>
</body>
</html>
