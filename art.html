<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art Gallery</title>
    <link rel="stylesheet" href="style.css"> <!-- Link to main styles for header -->
    <link rel="stylesheet" href="art.css"> <!-- Link to art.css -->
</head>
<body>

    <header class="site-header">
        <div class="header-left">
            <a href="javascript:history.back()" class="back-button"> 
                <img src="images/back-button.svg" alt="Back">
            </a>
            <nav class="main-nav"></nav>
        </div>
        <div class="header-center">
            <img src="images/theo-lebeaux-logo.png" alt="Theo Lebeaux Logo" class="logo">
        </div>
        <div class="header-right">
            <!-- This can be empty or hold future right-aligned items -->
        </div>
    </header>

    <img src="images/art-text.svg" alt="Art" class="page-title-svg">

    <div class="art-gallery">
        <!-- Item 1 -->
        <div class="art-item" tabindex="0">
            <div class="preview" style="background-image: url('images/the look of love cmyk.png');"></div>
            <span class="art-title">The Look of Love</span>
            <div class="full-image-container">
                <img class="full-image" src="images/the look of love cmyk.png" alt="Full view of The Look of Love">
            </div>
        </div>
        <!-- Item 2 -->
        <div class="art-item" tabindex="0">
            <div class="preview" style="background-image: url('images/man of mood cmyk 2.png');"></div>
            <span class="art-title">Man of Mood</span>
            <div class="full-image-container">
                <img class="full-image" src="images/man of mood cmyk 2.png" alt="Full view of Man of Mood">
            </div>
        </div>
        <!-- Item 3 -->
        <div class="art-item" tabindex="0">
            <div class="preview" style="background-image: url('images/egg cmyk.png');"></div>
            <span class="art-title">Egg</span>
            <div class="full-image-container">
                <img class="full-image" src="images/egg cmyk.png" alt="Full view of Egg">
            </div>
        </div>
        <!-- Item 4 -->
        <div class="art-item" tabindex="0">
            <div class="preview" style="background-image: url('images/art/art-image3.jpg');"></div>
            <span class="art-title">Being in the Present</span>
            <div class="full-image-container">
                <img class="full-image" src="images/art/art-image3.jpg" alt="Full view of Being in the Present">
            </div>
        </div>
        <!-- Item 5 -->
        <div class="art-item" tabindex="0">
            <div class="preview" style="background-image: url('images/art/Untitled_Artwork(6).png');"></div>
            <span class="art-title">Cloudy Day</span>
            <div class="full-image-container">
                <img class="full-image" src="images/art/Untitled_Artwork(6).png" alt="Full view of Cloudy Day">
            </div>
        </div>
        <!-- Item 6 -->
        <div class="art-item" tabindex="0">
            <div class="preview" style="background-image: url('images/art/Untitled_Artwork(3).png');"></div>
            <span class="art-title">First Sip</span>
            <div class="full-image-container">
                <img class="full-image" src="images/art/Untitled_Artwork(3).png" alt="Full view of First Sip">
            </div>
        </div>

    </div>

    <script src="art.js"></script> <!-- Link to art.js -->
</body>
</html>
