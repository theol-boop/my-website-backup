<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>James Peach - Theo Lebeaux</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .jp-logo {
            display: flex;
            justify-content: center;
            padding: 40px 0 20px;
        }

        .jp-logo img {
            max-width: 340px;
            width: 80%;
            height: auto;
        }

        .jp-media {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 60px;
            padding: 40px 40px 80px;
        }

        .jp-media img {
            width: 100%;
            max-width: 900px;
            height: auto;
            display: block;
            border-radius: 4px;
        }

        .jp-media iframe {
            width: 100%;
            max-width: 900px;
            aspect-ratio: 16 / 9;
            border: none;
            border-radius: 4px;
            display: block;
        }
    </style>
</head>
<body class="james-peach-page">
    <header class="site-header">
        <div class="header-left">
            <a href="index.html" class="back-button">
                <img src="images/back-button.svg" alt="Back">
            </a>
            <nav class="main-nav"></nav>
        </div>
        <div class="header-center">
            <img src="images/theo-lebeaux-logo.png" alt="Theo Lebeaux Logo" class="logo">
        </div>
        <div class="header-right"></div>
    </header>

    <main class="james-peach-content">
        <div class="jp-logo">
            <img src="images/jp-animated-logo-transparent.gif" alt="James Peach">
        </div>

        <div class="jp-media">
            <img src="images/jp-widescreen2.png" alt="James Peach Widescreen">
            <img src="images/Sunset Beach Still(1).jpg" alt="Sunset Beach">
            <iframe src="https://www.youtube.com/embed/JeMmLC6tLMA" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </main>

    <footer></footer>

    <script src="script.js" defer></script>
</body>
</html>
