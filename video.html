<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video - Theo Lebeaux</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="video-page-dark-theme">
    <header class="site-header">
        <div class="header-left">
            <a href="index.html" class="back-button">
                <img src="images/back-button.svg" alt="Back">
            </a>
            <nav class="main-nav"></nav>
        </div>
        <div class="header-center">
            <img src="images/theo-lebeaux-logo.png" alt="Theo Lebeaux Logo" class="logo">
        </div>
        <div class="header-right">
            <!-- This can be empty or hold future right-aligned items -->
        </div>
    </header>

    <main class="video-gallery-container">
        <h1>Video</h1>
        <div class="video-gallery">
            <div class="video-item">
                <iframe width="560" height="315" src="https://www.youtube.com/embed/vriI_g9IrPA" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>

            <div class="video-item">
                <iframe width="560" height="315" src="https://www.youtube.com/embed/JeMmLC6tLMA" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>

            <div class="video-item">
                <iframe width="560" height="315" src="https://www.youtube.com/embed/pMHnA3pfhqc" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
        </div>
    </main>

    <!-- Theater Mode Overlay -->
    <div id="theater-overlay"></div>
    <!-- Placeholder for the actual video player in theater mode -->
    <div id="theater-player-container"></div>

    <footer>
        <!-- Footer content can be added later -->
    </footer>

    <script src="script.js" defer></script>
</body>
</html>
