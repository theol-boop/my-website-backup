<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>HarpMog</title>
<style>
:root {
  --pf: -apple-system,'Helvetica Neue',Arial,sans-serif;
  --mf: -apple-system,'Helvetica Neue',Arial,sans-serif;
  --bg:       #000000;
  --bg2:      #0a0a0a;
  --bg3:      #0f0f0f;
  --border:   #1e2040;
  --border-b: #0a0c20;
  --neon-c:   #00ffcc;   /* cyan — primary accent */
  --neon-r:   #ff2244;   /* red */
  --neon-y:   #ffe600;   /* yellow */
  --neon-o:   #ff6600;   /* orange */
  --neon-p:   #cc00ff;   /* purple */
  --neon-pk:  #ff2288;   /* pink */
  --neon-tl:  #00ddbb;   /* teal */
  --neon-b:   #0088ff;   /* blue */
  --dim:      #1a2a2a;   /* dimmed surface */
  --text:     #ffb347;   /* primary text */
  --text-d:   #8a5a1a;   /* dimmed text */
  --red:#ff2244; --red-d:#660011;
  --blue:#0088ff; --blue-d:#003366;
  --blue-lt:#44aaff; --blue-lt-d:#1155aa;
  --green:#00ffcc; --green-d:#004433;
  --yellow:#ffe600; --yellow-d:#554400;
  --orange:#ff6600; --orange-d:#552200;
  --teal:#00ddbb; --teal-d:#004433;
  --pink:#ff2288; --pink-d:#660033;
  --purple:#cc00ff; --purple-d:#440066;
  --screen:#00000a; --screen-b:#0a0a1a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;}
html,body{width:100%;height:100%;height:100dvh;overflow:hidden;touch-action:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;background:#000;}
#app{touch-action:none;}
a,button,input,select,textarea,div,span{touch-action:manipulation;}
#app{position:fixed;top:0;left:0;right:0;bottom:0;
  width:100%;height:100%;height:100dvh;
  display:grid;grid-template-columns:minmax(0,62fr) minmax(0,38fr);
  padding:max(env(safe-area-inset-top),10px) max(env(safe-area-inset-right),10px)
          max(env(safe-area-inset-bottom),24px) max(env(safe-area-inset-left),10px);
  gap:10px;
  box-sizing:border-box;}

/* ── CRT OVERLAY ── */
#crt-overlay{
  position:fixed;inset:0;
  width:100%;height:100%;
  pointer-events:none;
  z-index:999;
  display:block;
}
body::after{
  content:'';
  position:fixed;inset:0;
  pointer-events:none;
  z-index:998;
  background:
    repeating-linear-gradient(
      0deg,
      transparent,
      transparent 5px,
      rgba(0,0,0,0.10) 5px,
      rgba(0,0,0,0.10) 6px
    );
  mix-blend-mode:multiply;
}

/* ── LEFT PANEL ── */
#left-panel{display:flex;flex-direction:column;gap:6px;min-height:0;overflow:hidden;height:100%;}
#bottom-dock{display:flex;flex-direction:column;gap:6px;margin-top:auto;flex-shrink:0;}


.block-label{
  font-family:var(--pf);font-size:9px;letter-spacing:.05em;
  color:#ffb347;text-transform:uppercase;
  border-left:2px solid #ffb347;
  padding-left:6px;margin-bottom:2px;
  font-weight:700;
  text-shadow:0 0 8px rgba(255,179,71,.7);
}
#chord-block{display:flex;flex-direction:column;gap:6px;flex-shrink:0;}
#inst-block{display:flex;flex-direction:column;gap:6px;flex-shrink:0;}
#fx-block{display:flex;flex-direction:column;gap:4px;flex-shrink:0;}
/* 6 faders in a row; 2 rows of 3 on phones held upright (see SMALL SCREENS) */
#fx-knobs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;}
.fx-unit{min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;}
.fx-name{
  font-family:var(--pf);font-size:8px;letter-spacing:-.01em;
  color:#8a5a1a;text-align:center;text-transform:uppercase;font-weight:600;
}

/* ── FADER BARS ── */
.fader-wrap{
  width:100%;height:26px;
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:2px;
  position:relative;
  cursor:pointer;touch-action:none;
  overflow:hidden;
}
.fader-fill{
  position:absolute;top:0;left:0;bottom:0;width:0%;
  background:linear-gradient(90deg,rgba(255,140,0,.3),rgba(255,179,71,.7));
  transition:width .05s linear;
  z-index:1;
  pointer-events:none;
}
.fader-line{
  position:absolute;top:0;bottom:0;width:2px;
  background:#fff;
  box-shadow:0 0 10px #ffb347,0 0 20px rgba(255,179,71,.5);
  pointer-events:none;
  z-index:2;
  left:0%;transform:translateX(-1px);
}

/* ── RIGHT PANEL ── */
#right-panel{display:flex;flex-direction:column;gap:6px;min-height:0;overflow:hidden;}
#screen-housing{
  flex:1;min-height:0;
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:6px;
  padding:6px;
  display:flex;flex-direction:column;gap:4px;
  overflow:hidden;
}
/* Doubles as the readout: current chord · pattern · instruments */
#screen-label{
  font-family:var(--mf);font-size:7px;letter-spacing:.3em;
  color:#8a5a1a;text-align:center;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#screen-label span{color:#ffb347;text-shadow:0 0 6px rgba(255,179,71,.5);}
#led-panel{
  background:transparent;
  padding:0;
  flex-shrink:0;
  width:96px;
  align-self:flex-end;
  overflow:hidden;
  position:relative;
  margin-top:3px;
  border:1px solid var(--border);
  border-radius:4px;
  opacity:0.88;
}
#led-panel:hover{opacity:1;}
#scope-wrap{
  display:grid;
  grid-template-columns:1fr 28px;
  width:100%;
}
#waveform-canvas{
  display:block;
  width:100%;
  height:auto;
  aspect-ratio:1/1;
}
/* ── SCOPE (right-side dials) ── */
#scope-side{
  display:flex;flex-direction:column;justify-content:space-evenly;align-items:center;
  padding:2px 2px;
  background:rgba(0,0,0,.25);
  border-left:1px solid var(--border);
  align-self:stretch;
  overflow:hidden;
}
.scope-unit{
  display:flex;flex-direction:column;align-items:center;gap:0;min-width:0;
  flex:1;justify-content:center;
}
.scope-dial{
  width:16px;height:16px;flex-shrink:0;
  border-radius:50%;
  position:relative;
  cursor:pointer;touch-action:none;
  -webkit-tap-highlight-color:transparent;
  background:
    radial-gradient(circle at 35% 28%,rgba(60,80,90,.35),transparent 45%),
    radial-gradient(circle at 50% 50%,#0c1014 0%,#050608 72%,#000 100%);
  border:1px solid var(--border);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 1px 4px rgba(0,0,0,.5);
}
.scope-dial:active{filter:brightness(1.08);}
.scope-dial-ring{
  position:absolute;inset:1px;border-radius:50%;
  border:1px solid rgba(0,255,204,.12);
  pointer-events:none;
  background:repeating-conic-gradient(
    from -90deg,
    transparent 0deg 24deg,
    rgba(0,255,204,.07) 24deg 26deg
  );
}
.scope-dial-pointer{
  position:absolute;left:50%;top:50%;
  width:1px;height:5px;margin-left:-.5px;margin-top:-4px;
  background:linear-gradient(180deg,var(--neon-c),rgba(0,255,204,.4));
  border-radius:1px;
  transform-origin:50% 4px;
  transform:rotate(var(--scope-rot,-135deg));
  box-shadow:0 0 3px rgba(0,255,204,.9);
  pointer-events:none;
}
.scope-dial-name{
  display:none;
}

/* ── BUTTONS ── */
.gb-btn{
  position:relative;border:none;background:none;cursor:pointer;outline:none;
  -webkit-touch-callout:none;user-select:none;
  flex:1;display:flex;align-items:center;justify-content:center;
}
.gb-btn .well{position:absolute;inset:0;border-radius:5px;}
.gb-btn .face{
  position:absolute;inset:0;
  border-radius:5px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--pf);
  font-size:90%;   /* fills ~90% of button height */
  letter-spacing:-.02em;
  font-weight:600;
  text-transform:uppercase;
  line-height:1;
  transition:filter .04s,opacity .04s;
}
.gb-btn.sunken .face,.gb-btn.pressed .face{opacity:.7;filter:brightness(.8);}
.gb-btn.active .face{filter:brightness(1.2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.5);}

/* Color variants — neon on dark */
.gb-red   .well{background:rgba(255,34,68,.12);border:1px solid var(--neon-r);}
.gb-red   .face{color:var(--neon-r);text-shadow:0 0 10px var(--neon-r);}
.gb-blue  .well{background:rgba(0,136,255,.12);border:1px solid var(--neon-b);}
.gb-blue  .face{color:var(--neon-b);text-shadow:0 0 10px var(--neon-b);}
.gb-bluelt .well{background:rgba(68,170,255,.10);border:1px solid var(--blue-lt);}
.gb-bluelt .face{color:var(--blue-lt);text-shadow:0 0 8px var(--blue-lt);}
.gb-green .well{background:rgba(0,255,204,.10);border:1px solid var(--neon-c);}
.gb-green .face{color:var(--neon-c);text-shadow:0 0 10px var(--neon-c);}
.gb-yellow .well{background:rgba(255,230,0,.10);border:1px solid var(--neon-y);}
.gb-yellow .face{color:var(--neon-y);text-shadow:0 0 10px var(--neon-y);}
.gb-orange .well{background:rgba(255,102,0,.10);border:1px solid var(--neon-o);}
.gb-orange .face{color:var(--neon-o);text-shadow:0 0 8px var(--neon-o);}
.gb-purple .well{background:rgba(204,0,255,.10);border:1px solid var(--neon-p);}
.gb-purple .face{color:var(--neon-p);text-shadow:0 0 10px var(--neon-p);}
.gb-teal  .well{background:rgba(0,221,187,.10);border:1px solid var(--neon-tl);}
.gb-teal  .face{color:var(--neon-tl);text-shadow:0 0 8px var(--neon-tl);}
.gb-pink  .well{background:rgba(255,34,136,.10);border:1px solid var(--neon-pk);}
.gb-pink  .face{color:var(--neon-pk);text-shadow:0 0 10px var(--neon-pk);}

/* Active state: filled background */
.gb-btn.active .well{filter:brightness(2.5);}

/* ── SIZE VARIANTS ── */
#chord-btns{display:flex;gap:6px;}
#key-rows{display:flex;flex-direction:column;gap:6px;flex-shrink:0;}
.key-row{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:2px;}
.chr-gb{height:32px;flex:none;width:100%;}
.chr-gb .face{font-size:15px;letter-spacing:-.02em;}
#chord-btns .gb-btn{height:36px;flex:1;}
#chord-btns .gb-btn .face{font-size:20px;letter-spacing:-.03em;}
#sub-buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;
  max-height:0;opacity:0;pointer-events:none;overflow:hidden;
  transition:max-height .22s ease,opacity .15s;}
#sub-buttons.visible{max-height:400px;opacity:1;pointer-events:all;}
/* Patterns only apply to C- / F-: dimmed (but kept in place, so nothing jumps) while a coloured key is selected */
#sub-buttons.visible.inactive{opacity:.22;pointer-events:none;}
.sub-gb{height:36px;flex:none;width:100%;}
.sub-gb .face{font-size:16px;letter-spacing:-.02em;}
#inst-btns{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;}
.inst-gb{height:32px;width:100%;flex:none;}
.inst-gb .face{font-size:13px;letter-spacing:-.02em;}

/* ── LOOPER PANEL ── */
#looper-panel{
  flex-shrink:0;
  background:var(--screen);
  border:1px solid var(--border);
  border-radius:6px;
  padding:6px 8px;
  display:flex;flex-direction:column;gap:5px;
}
#looper-transport{display:flex;gap:5px;}
.lp-btn{
  flex:1;height:32px;border:1px solid #ffb347;background:transparent;border-radius:5px;
  color:#ffb347;font-family:var(--pf);font-size:15px;letter-spacing:-.02em;font-weight:600;
  cursor:pointer;outline:none;
  transition:background .08s,color .08s;
}
.lp-btn:active{background:rgba(0,255,204,.15);}
.lp-btn.active{background:rgba(255,179,71,.18);color:#fff;text-shadow:0 0 8px rgba(255,179,71,.8);box-shadow:inset 0 0 8px rgba(255,179,71,.15);}
.lp-btn.rec-armed{border-color:#ff4466;color:#ff4466;text-shadow:0 0 8px rgba(255,68,102,.8);animation:blink .7s infinite;}
.lp-btn.rec-active{background:rgba(255,68,102,.22);border-color:#ff4466;color:#fff;text-shadow:0 0 8px rgba(255,68,102,.8);}
.lp-clear{border-color:var(--text-d)!important;color:var(--text-d)!important;text-shadow:none!important;}
.lp-clear:active{background:rgba(255,255,255,.08)!important;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}

/* ── FOOTER / BACK LINKS (back links only appear when you arrived from another page on the same site) ── */
#app-foot{padding:4px 4px 2px;flex-shrink:0;display:flex;gap:10px;align-items:baseline;
  font-family:var(--pf);font-weight:700;font-size:9px;letter-spacing:.02em;text-transform:uppercase;color:var(--text-d);}
#app-foot a,.back-link{color:var(--text-d);text-decoration:none;}
#app-foot a:hover,.back-link:hover{color:#ffb347;}
.back-link{position:fixed;z-index:101;
  top:max(env(safe-area-inset-top),10px);left:max(env(safe-area-inset-left),10px);padding:8px;
  font-family:var(--pf);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;}
[hidden]{display:none!important;}

/* ── HARP BOARD ── */
#harp-board{
  flex:1;min-height:0;
  background:var(--screen);
  border:1px solid var(--border);
  display:flex;flex-direction:column;
  padding:4px 8px 4px 8px;
  overflow:hidden;position:relative;touch-action:none;
}
/* Scan-line overlay */
#harp-board::before{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:1;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.18) 2px,rgba(0,0,0,.18) 4px);
}
.string-row{display:flex;align-items:center;flex:1;min-height:0;}
.string-line-wrap{flex:1;height:100%;position:relative;}
.string-line{position:absolute;top:50%;left:0;right:0;transform:translateY(-50%);border-radius:0;pointer-events:none;}

/* ── UNLOCK SCREEN ── */
#unlock-overlay{
  position:fixed;inset:0;background:var(--bg);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:20px;z-index:100;
}
#unlock-overlay::before{
  content:'';position:fixed;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,255,204,.015) 3px,rgba(0,255,204,.015) 4px);
}
.ul-title{
  font-family:var(--pf);font-size:36px;color:#ffb347;letter-spacing:.05em;font-weight:800;
  text-shadow:0 0 30px rgba(255,179,71,.9),0 0 80px rgba(255,140,0,.5),0 0 2px #fff;
  position:relative;
}
.ul-sub{font-family:var(--pf);font-size:11px;color:#8a5a1a;letter-spacing:.12em;font-weight:600;position:relative;}
#unlock-btn{position:relative;width:200px;height:56px;border:none;background:none;cursor:pointer;outline:none;border-radius:6px;}
#unlock-btn .well{position:absolute;inset:0;border-radius:6px;background:rgba(255,179,71,.08);border:2px solid #ffb347;box-shadow:0 0 20px rgba(255,179,71,.35),inset 0 0 12px rgba(255,179,71,.05);}
#unlock-btn .face{position:absolute;inset:0;border-radius:6px;background:transparent;color:#ffb347;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--pf);font-size:18px;letter-spacing:.1em;font-weight:700;
  text-shadow:0 0 16px rgba(255,179,71,.9),0 0 40px rgba(255,140,0,.4);}
#unlock-btn:active .face{opacity:.6;}

/* ── SMALL SCREENS ── */
/* Narrow (phones held upright): FX in 2 rows of 3, smaller labels so everything fits its button */
@media (max-width:480px){
  #fx-knobs{grid-template-columns:repeat(3,minmax(0,1fr));}
  .lp-btn{font-size:12px;}
  .inst-gb .face{font-size:11px;}
}
/* Short phones held upright (iPhone SE and similar): slightly shorter buttons so the instrument row fits */
@media (orientation:portrait) and (max-height:720px){
  #chord-btns .gb-btn{height:32px;}
  .sub-gb{height:31px;}
  .chr-gb{height:28px;}
  .inst-gb{height:28px;}
}
/* Phones held sideways: the left side splits into two columns (chords + instruments | key rows)
   so nothing is cut off, and the strings get most of the right-hand side */
@media (orientation:landscape) and (max-height:560px){
  #app{grid-template-columns:minmax(0,64fr) minmax(0,36fr);gap:8px;
    padding:max(env(safe-area-inset-top),6px) max(env(safe-area-inset-right),8px)
            max(env(safe-area-inset-bottom),6px) max(env(safe-area-inset-left),8px);}
  #left-panel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    grid-template-rows:auto minmax(0,1fr);grid-template-areas:"chords keys" "inst keys";
    column-gap:8px;row-gap:4px;}
  #chord-block{grid-area:chords;gap:4px;}
  #sub-buttons{gap:4px;}
  #key-rows{grid-area:keys;gap:5px;justify-content:center;}
  .key-row{gap:4px;margin-top:0;}
  #bottom-dock{grid-area:inst;margin-top:0;align-self:end;}
  #inst-block{gap:4px;}
  #app-foot{display:none;}
  .block-label{margin-bottom:0;}
  #chord-btns .gb-btn{height:clamp(24px,7.6vh,34px);}
  #chord-btns .gb-btn .face{font-size:17px;}
  .sub-gb{height:clamp(22px,7.2vh,32px);}
  .sub-gb .face{font-size:13px;}
  .chr-gb{height:clamp(22px,8.4vh,36px);}
  .chr-gb .face{font-size:13px;}
  .inst-gb{height:clamp(22px,7.2vh,32px);}
  .inst-gb .face{font-size:10px;}
  #inst-btns{gap:3px;}
  #fx-block{gap:2px;}
  #fx-knobs{gap:4px;}
  .fx-name{font-size:7px;}
  .fader-wrap{height:20px;}
  #looper-panel{flex-direction:row;align-items:center;padding:4px 6px;gap:6px;}
  #looper-transport{flex:1;}
  .lp-btn{height:30px;font-size:12px;}
  #led-panel{width:44px;margin-top:0;align-self:center;}
  #scope-wrap{grid-template-columns:1fr;}
  #scope-side{display:none;}
}
</style>
</head>
<body>
<div id="unlock-overlay">
  <a class="back-link site-back" href="javascript:history.back()" hidden>&#8249; back</a>
  <div class="ul-title">HARPMOG</div>
  <div style="font-family:var(--pf);font-size:9px;letter-spacing:.2em;color:#666;margin-top:-8px;">HARMONIC STRING INSTRUMENT</div>
  <div class="ul-sub">PRESS START</div>
  <button id="unlock-btn"><div class="well"></div><div class="face">START</div></button>
</div>
<div id="app" style="visibility:hidden">
  <div id="left-panel">
    <div id="chord-block">
      <div class="block-label">· chord ·</div>
      <div id="chord-btns">
        <button class="gb-btn gb-yellow" id="btn-cmin" data-chord="cmin"><div class="well"></div><div class="face">C-</div></button>
        <button class="gb-btn gb-yellow" id="btn-fmin" data-chord="fmin"><div class="well"></div><div class="face">F-</div></button>
      </div>
      <div id="sub-buttons">
        <button class="gb-btn sub-gb gb-red" data-sub="base"><div class="well"></div><div class="face">BASE</div></button>
        <button class="gb-btn sub-gb gb-red" data-sub="deep"><div class="well"></div><div class="face">DEEP</div></button>
        <button class="gb-btn sub-gb gb-red" data-sub="shimmer"><div class="well"></div><div class="face">SHIM</div></button>
        <button class="gb-btn sub-gb gb-red" data-sub="blue"><div class="well"></div><div class="face">BLUE</div></button>
        <button class="gb-btn sub-gb gb-red" data-sub="45"><div class="well"></div><div class="face">45</div></button>
        <button class="gb-btn sub-gb gb-red" data-sub="fminarp"><div class="well"></div><div class="face">F-</div></button>
        <button class="gb-btn sub-gb gb-red" data-sub="copper"><div class="well"></div><div class="face">COPR</div></button>
        <button class="gb-btn sub-gb gb-red" data-sub="darp"><div class="well"></div><div class="face">D</div></button>
        <button class="gb-btn sub-gb gb-red" data-sub="garp"><div class="well"></div><div class="face">G</div></button>
        <button class="gb-btn sub-gb gb-red" data-sub="bbarp"><div class="well"></div><div class="face">Bb</div></button>
        <button class="gb-btn sub-gb gb-red" data-sub="abmaj7"><div class="well"></div><div class="face">Ab^7</div></button>
        <button class="gb-btn sub-gb gb-red" data-sub="ebmaj"><div class="well"></div><div class="face">Eb^</div></button>
      </div>
    </div>
    <div id="key-rows">

<script>
(function(){
'use strict';

// ── NOTES ─────────────────────────────────────────────────────
const NN=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const NM={C:0,Db:1,D:2,Eb:3,E:4,F:5,Gb:6,G:7,Ab:8,A:9,Bb:10,B:11};
const C2=36,C8=108;      // MIDI range of the strings
const MAX_STRINGS=42;    // the board always draws 42 lines

// ── HOW A CHORD BECOMES STRINGS ──────────────────────────────
// A "cell" is an ordered list of note names, written low → high.
// voicing() walks it upward: the first note lands in octave 2 (C2–B2),
// and each next note is the nearest copy of that note ABOVE the one
// before. When the cell runs out it starts again from its first note;
// the walk stops at C8.
//   ['C','G','D','Eb'] → C2 G2 D3 Eb3 C4 G4 D5 Eb5 C6 …
// So the ORDER of the cell is the voicing: wide leaps spread the chord
// out, small steps keep it close. A long cell can reach C8 before it
// finishes, and notes after that point are never heard.
// The result (usually 12–25 notes) is spread across the 42 drawn
// strings, so neighbouring lines often share a note.
function voicing(cell){
  let last=C2+(NM[cell[0]]??0);
  const out=[last];
  for(let idx=1;;idx++){
    let m=Math.floor(last/12)*12+(NM[cell[idx%cell.length]]??0);
    if(m<=last)m+=12;
    if(m>C8)break;
    out.push(m);last=m;
  }
  return out.slice(0,MAX_STRINGS);
}
// SCALE mode: every note of the natural minor scale from C2 up (42 notes)
function minorScale(root){
  const iv=[0,2,3,5,7,8,10],rp=NM[root],out=[];
  for(let m=C2;m<=C8&&out.length<MAX_STRINGS;m++)if(iv.includes(((m-rp)%12+12)%12))out.push(m);
  return out;
}
function transpose(cell,semis){return cell.map(n=>NN[(NM[n]+semis+120)%12]);}

// ── C- / F- AND THE RED PATTERN BUTTONS ───────────────────────
// Patterns written in C minor; F- plays them a 4th higher.
const PATTERNS={
  base:   ['C','G','D','Eb','G','Bb','D','Eb','Bb','D','G','Bb','D','F'],
  deep:   ['C','G','D','Eb','Bb','F','D','G','C','D','G','Bb','Eb','F'],
  shimmer:['C','G','D','Eb','G','A','Bb','D','F','Bb','C','D','A','D','F','G','D','Eb','F','A'],
  blue:   ['C','F','Bb','Eb','G','C','F','Bb','D','F','Bb','Eb','G','C','F','Bb','D','F','G','C'],
  '45':   ['C','F','G','C','F','G','C','F','Bb','C','F','G','C','D','G','Bb','Eb','F','Bb','D','G','A','D','Eb','Ab','Bb','Eb','G','C','D','G','C','F','G','C'],
};
// Fixed chords: the same notes whether C- or F- is selected.
const FIXED_CHORDS={
  fminarp:['F','Ab','C','Eb','F','G','Ab','Bb','C','D','Eb','F','G','Bb','D','Eb','F','Ab','C','Eb','G','Ab'],
  copper: ['C','G','D','F','C','G','D','A','C','G','D','G','C','D','C','F','A'],
  darp:   ['D','G','A','D','G','A','D','G','A','D','G','A','D','G','A','D','G','A','D','G','A','D','G','A','D','G','A','D','G','A','D'],
  garp:   ['G','Bb','D','F','B','Bb','D','F','G','Bb','D','F','A','C','D','F','G','Bb','A','C','D','F'],
  bbarp:  ['Bb','D','F','A','Bb','D','Eb','F','A','C','E','G','A','Bb','D','F','G','G','A','A','Bb','C','D'],
  abmaj7: ['Ab','C','Eb','G','C','F','Bb','D','Eb','G','Ab','C','Eb','F','G','Bb','F','G','Bb'],
  ebmaj:  ['Eb','G','Bb','D','F','G','Bb','C','D','F','G','Bb','D','Eb','G','A','D','F','G','C','Eb','D'],
};
function chordSets(root,semis){
  const sets={scale:minorScale(root)};
  for(const k in PATTERNS)sets[k]=voicing(transpose(PATTERNS[k],semis));
  for(const k in FIXED_CHORDS)sets[k]=voicing(FIXED_CHORDS[k]);
  return sets;
}
const CHORDS={cmin:chordSets('C',0),fmin:chordSets('F',5)};

// ── THE FOUR COLOURED KEY ROWS ────────────────────────────────
// One cell per row, written in C, played in all 12 keys.
const KEY_ROWS={
  k45: {label:'45',     cell:PATTERNS['45']},                      // purple: the 45 pattern
  k5th:{label:'5TH',    cell:['C','F','Bb','Eb','G']},             // teal: stacked 4ths, then G
  kong:{label:'ORANGE', cell:['C','G','D','E','A','E','B']},       // orange: open major (add 9, 6, 7)
  kpnk:{label:'PINK',   cell:['C','G','D','Eb','Ab','G','B','D','F','G','Ab','B']}, // pink: minor with Ab and B
};
const KEYS=['c','db','d','eb','e','f','gb','g','ab','a','bb','b'];
const KEY_SETS={};
for(const row in KEY_ROWS)KEYS.forEach((k,i)=>{KEY_SETS[row+'_'+k]=voicing(transpose(KEY_ROWS[row].cell,i));});

const state={chord:'cmin',mode:'scale',insts:new Set(['harp']),ds:[],vis:[]};
function isKeyRow(id){return id in KEY_SETS;}
function getSet(){
  if(isKeyRow(state.chord))return KEY_SETS[state.chord];
  const c=CHORDS[state.chord];
  return c[state.mode]||c.scale;
}
function applySet(){
  state.ds=[...getSet()].reverse(); // real notes, high → low (top string first)
  // Spread the real notes evenly over the 42 drawn strings
  state.vis=[];
  for(let i=0;i<MAX_STRINGS;i++){
    const ri=Math.round(i*(state.ds.length-1)/Math.max(1,MAX_STRINGS-1));
    state.vis.push(state.ds[ri]);
  }
  buildBoard();updateLED();prewarm();
}

// ── HARP BOARD ────────────────────────────────────────────────
function buildBoard(){
  const board=document.getElementById('harp-board');board.innerHTML='';
  const vis=state.vis;
  const NUM=vis.length;
  for(let i=0;i<NUM;i++){
    const row=document.createElement('div');row.className='string-row';
    const wrap=document.createElement('div');wrap.className='string-line-wrap';
    const line=document.createElement('div');line.className='string-line';line.id='S'+i;
    line.dataset.midi=vis[i]||60;
    const mid=(NUM-1)/2,dist=Math.abs(i-mid)/Math.max(1,mid);
    const thick=(1.7-dist*.8).toFixed(1);
    line.style.cssText=`height:${thick}px;margin-top:${(-thick/2).toFixed(1)}px;`;
    const g=Math.round(60+(1-dist)*40);
    line.style.background=`rgba(180,${g+60},0,0.45)`;line.dataset.g=g;
    wrap.appendChild(line);row.appendChild(wrap);board.appendChild(row);
  }
}
function flash(i){
  const s=document.getElementById('S'+i);if(!s)return;
  s.style.background='rgba(255,200,80,0.98)';
  s.style.boxShadow='0 0 12px rgba(255,179,71,1),0 0 24px rgba(255,140,0,0.6)';
  setTimeout(()=>{
    s.style.background=`rgba(180,${parseInt(s.dataset.g)+60},0,0.42)`;s.style.boxShadow='none';},170);
}
// Readout above the strings: chord · pattern · instruments
const KEY_NAMES={c:'C',db:'Db',d:'D',eb:'Eb',e:'E',f:'F',gb:'Gb',g:'G',ab:'Ab',a:'A',bb:'Bb',b:'B'};
const MODE_NAMES={scale:'SCALE',base:'BASE ARP',deep:'DEEP ARP',shimmer:'SHIMMER',blue:'BLUE','45':'45',
  fminarp:'F MINOR',copper:'COPPER',darp:'D',garp:'G',bbarp:'Bb',abmaj7:'Ab MAJ 7',ebmaj:'Eb MAJ'};
function updateLED(){
  let chord,mode;
  if(isKeyRow(state.chord)){
    const [row,key]=state.chord.split('_');
    chord=KEY_NAMES[key];mode=KEY_ROWS[row].label;
  } else {
    chord={cmin:'C-',fmin:'F-'}[state.chord];mode=MODE_NAMES[state.mode]||'';
  }
  document.getElementById('led-chord').textContent=chord;
  document.getElementById('led-mode').textContent=mode;
  document.getElementById('led-inst').textContent=[...state.insts].map(s=>s.toUpperCase()).join('+');
}

// ── AUDIO — pre-baked buffer cache, distinct synthesis per voice ─
let actx=null,master=null,reverbConv=null,reverbSend=null,delayNode=null,delaySend=null;
let analyser=null,waveRaf=null;
let scopeWaveBuf=null;
const scopeState={time:50,gain:55,persist:28,xy:18};
function scopeFftFromTime(t){
  const sizes=[512,1024,2048];
  return sizes[Math.min(2,Math.floor(Number(t)/34.001))];
}
let tapeDelay=null,tapeLFO=null,tapeLFOGain=null,tapeFilter=null,tapeSend=null;
let pingDelay=null,pingSend=null,warbleLFO=null,warbleLFOGain=null,warbleDelay=null,warbleSend=null,crushSend=null,crushWS=null;
let limiter=null;

// Karplus-Strong plucked string, shared by HARP and BASS.
// The loop is tuned with a fractional (allpass) delay so every string is
// in tune; a whole-sample delay line drifts sharp as notes get higher
// (it was ~10 cents sharp at middle C and up to 2–4 semitones in the top octave).
function bakeKS(freq,sr,dur,loss,lpHz){
  const D=sr/freq;                        // loop length needed, in samples
  const N=Math.max(2,Math.floor(D-0.6));  // whole samples (the averaging filter adds 0.5)
  const frac=D-0.5-N;                     // leftover fraction, 0.1–1.1 samples
  const w=2*Math.PI*freq/sr;
  const C=Math.sin((1-frac)*w/2)/Math.sin((1+frac)*w/2); // allpass coefficient for that delay
  const bufLen=Math.ceil(sr*dur);
  const buf=actx.createBuffer(1,bufLen,sr);
  const data=buf.getChannelData(0);
  const dl=new Float32Array(N);
  for(let i=0;i<N;i++)dl[i]=(Math.random()*2-1)*0.92;
  const alpha=lpHz/(lpHz+sr/(2*Math.PI));
  let ix=0,prev=0,apIn=0,apOut=0,lp=0;
  for(let i=0;i<bufLen;i++){
    const cur=dl[ix];
    const avg=loss*(cur+prev);prev=cur;
    const ap=C*avg+apIn-C*apOut;apIn=avg;apOut=ap;
    dl[ix]=ap;ix=(ix+1)%N;
    lp=alpha*ap+(1-alpha)*lp;data[i]=lp;
  }
  return buf;
}
// HARP — warm pluck
function bakeHarp(freq,sr){return bakeKS(freq,sr,2.8,0.4965,5500);}
// BASS — heavy low-pass, long decay
function bakeBass(freq,sr){return bakeKS(freq,sr,3.5,0.4952,1200);}
// Partials above ~Nyquist fold back as out-of-tune junk on high notes: skip them
function audible(freq,ratio,sr){return freq*ratio<sr*0.45;}

// BELL — additive harmonics with inharmonic partials, metallic shimmer
function bakeBell(freq,sr){
  const dur=3.5,bufLen=Math.ceil(sr*dur);
  const buf=actx.createBuffer(1,bufLen,sr);
  const data=buf.getChannelData(0);
  // bell partials: ratios and relative amplitudes (slightly inharmonic)
  const partials=[
    {r:1.0,  a:0.60, d:3.5},
    {r:2.756,a:0.25, d:1.8},
    {r:5.404,a:0.12, d:1.0},
    {r:8.933,a:0.06, d:0.6},
    {r:13.46,a:0.03, d:0.4},
  ];
  const parts=partials.filter(p=>audible(freq,p.r,sr));
  for(let i=0;i<bufLen;i++){
    let s=0;
    for(const p of parts){
      const env=Math.exp(-i/(sr*p.d));
      s+=Math.sin(2*Math.PI*freq*p.r*i/sr)*p.a*env;
    }
    data[i]=s*0.5;
  }
  return buf;
}

// SINE — pure sine with fast exponential decay, marimba-like
function bakeSine(freq,sr){
  const dur=1.6,bufLen=Math.ceil(sr*dur);
  const buf=actx.createBuffer(1,bufLen,sr);
  const data=buf.getChannelData(0);
  // fundamental + weak second harmonic for warmth
  for(let i=0;i<bufLen;i++){
    const t=i/sr;
    const env=Math.exp(-t*4.5);
    const env2=Math.exp(-t*8.0);
    data[i]=(Math.sin(2*Math.PI*freq*t)*env + Math.sin(2*Math.PI*freq*2*t)*0.18*env2)*0.7;
  }
  return buf;
}

// PAD — additive sines with slow attack baked in
function bakePad(freq,sr){
  const dur=4.0,bufLen=Math.ceil(sr*dur);
  const buf=actx.createBuffer(1,bufLen,sr);
  const data=buf.getChannelData(0);
  const attackSamples=Math.ceil(sr*0.08);
  const partials=[{r:1,a:0.55},{r:1.5,a:0.25},{r:2,a:0.12},{r:2.5,a:0.06},{r:3,a:0.03}].filter(p=>audible(freq,p.r,sr));
  for(let i=0;i<bufLen;i++){
    let s=0;
    for(const p of partials)s+=Math.sin(2*Math.PI*freq*p.r*i/sr)*p.a;
    const atk=Math.min(1,i/attackSamples);
    const dec=Math.exp(-i/(sr*3.8));
    data[i]=s*atk*dec*0.4;
  }
  return buf;
}

// ORGAN — Hammond-style: integer harmonics, no decay, steady drawbar mix
function bakeOrgan(freq,sr){
  const dur=2.5,bufLen=Math.ceil(sr*dur);
  const buf=actx.createBuffer(1,bufLen,sr);
  const data=buf.getChannelData(0);
  // drawbar harmonics: 16',8',4',2',1' + 2⅔',1⅗' (rotary shimmer via slow AM)
  const drawbars=[
    {r:0.5, a:0.20},{r:1,   a:0.70},{r:2,   a:0.50},
    {r:3,   a:0.12},{r:4,   a:0.35},{r:6,   a:0.08},
    {r:8,   a:0.20},{r:10,  a:0.04},{r:16,  a:0.08},
  ].filter(d=>audible(freq,d.r,sr));
  const rotaryHz=6.1; // Leslie cabinet rotation
  const atk=Math.ceil(sr*0.008);
  const rel=Math.ceil(sr*0.12);
  for(let i=0;i<bufLen;i++){
    let s=0;
    for(const d of drawbars)s+=Math.sin(2*Math.PI*freq*d.r*i/sr)*d.a;
    // rotary AM
    s*=1+0.18*Math.sin(2*Math.PI*rotaryHz*i/sr);
    // click attack + soft release
    const env=i<atk?(i/atk):(i>bufLen-rel?((bufLen-i)/rel):1);
    data[i]=s*env*0.18;
  }
  return buf;
}

// CHOIR — formant synthesis: two vowel formants (ah/oh) per note
function bakeChoir(freq,sr){
  // Optimised: all per-harmonic constants pre-computed outside sample loop
  // Inner loop is just sinf additions — no exp/formant math per sample
  const dur=3.0,bufLen=Math.ceil(sr*dur);
  const buf=actx.createBuffer(1,bufLen,sr);
  const data=buf.getChannelData(0);
  const formants=[
    {f:800,  bw:80,  g:1.0},
    {f:1200, bw:90,  g:0.7},
    {f:2500, bw:120, g:0.4},
    {f:3500, bw:200, g:0.15},
  ];
  // Pre-compute amplitude and phase-increment per harmonic
  const NUM_H=12;
  const phaseInc=new Float64Array(NUM_H);
  const amps=new Float64Array(NUM_H);
  for(let h=1;h<=NUM_H;h++){
    const hfreq=freq*h;
    let fgain=0;
    for(const fm of formants){
      const dist=hfreq-fm.f;
      fgain+=fm.g*Math.exp(-(dist*dist)/(2*fm.bw*fm.bw));
    }
    amps[h-1]=audible(freq,h,sr)?(1/h)*(fgain+0.05):0;
    phaseInc[h-1]=2*Math.PI*hfreq/sr;
  }
  // Running phase accumulators (avoid i*phaseInc which loses precision at large i)
  const phase=new Float64Array(NUM_H);
  const atk=Math.ceil(sr*0.10);
  const rel=Math.ceil(sr*0.25);
  const decayRate=1/(sr*2.8);
  for(let i=0;i<bufLen;i++){
    let s=0;
    for(let h=0;h<NUM_H;h++){
      s+=Math.sin(phase[h])*amps[h];
      phase[h]+=phaseInc[h];
    }
    const env=i<atk?(i/atk):(i>bufLen-rel?((bufLen-i)/rel):1);
    const breathEnv=Math.exp(-i*decayRate);
    data[i]=s*env*breathEnv*0.55;
  }
  return buf;
}


// CELLO — bowed string: sawtooth via additive with bow attack noise burst
function bakeCello(freq,sr){
  const dur=3.0,bufLen=Math.ceil(sr*dur);
  const buf=actx.createBuffer(1,bufLen,sr);
  const data=buf.getChannelData(0);
  const bowAtk=Math.ceil(sr*0.055);
  const harmonics=14;
  // Cello spectral envelope: strong 1st, dip at 2nd, peak at 3rd-4th
  const spectralEnv=[0,0.85,0.45,0.90,0.75,0.55,0.40,0.28,0.20,0.14,0.10,0.07,0.05,0.03,0.02];
  for(let i=0;i<bufLen;i++){
    const t=i/sr;
    let s=0;
    for(let h=1;h<=harmonics;h++){
      if(!audible(freq,h,sr))break;
      const amp=spectralEnv[h]||0;
      // slight odd/even asymmetry for bow character
      const phaseOdd=h%2===1?0:Math.PI*0.12;
      s+=Math.sin(2*Math.PI*freq*h*t+phaseOdd)*amp;
    }
    // bow attack: noise burst that fades into tone
    const bowNoise=(Math.random()*2-1)*Math.exp(-i/(sr*0.03));
    const bowAmt=Math.exp(-i/(bowAtk*0.7));
    const toneAmt=1-Math.exp(-i/(bowAtk*0.5));
    const bodyEnv=Math.exp(-t*1.1);
    data[i]=(s*toneAmt + bowNoise*bowAmt*0.5)*bodyEnv*0.32;
  }
  return buf;
}

// WOOD — log drum / woodblock: strong fundamental + 3rd harmonic + very fast noise attack
function bakeWood(freq,sr){
  const dur=1.2,bufLen=Math.ceil(sr*dur);
  const buf=actx.createBuffer(1,bufLen,sr);
  const data=buf.getChannelData(0);
  // hollow wood resonance: odd harmonics with specific envelope
  const partials=[
    {r:1.0, a:0.70, d:1.2},
    {r:2.76,a:0.20, d:0.4}, // slight inharmonicity for wood character
    {r:5.0, a:0.10, d:0.2},
  ].filter(p=>audible(freq,p.r,sr));
  for(let i=0;i<bufLen;i++){
    let s=0;
    for(const p of partials){
      const env=Math.exp(-i/(sr*p.d));
      s+=Math.sin(2*Math.PI*freq*p.r*i/sr)*p.a*env;
    }
    // sharp transient click
    const click=(Math.random()*2-1)*Math.exp(-i/(sr*0.004))*0.4;
    data[i]=(s+click)*0.6;
  }
  return buf;
}

// THUMB — kalimba/thumb piano: inharmonic tine + body resonance + metallic rattle partial
function bakeThumb(freq,sr){
  const dur=2.2,bufLen=Math.ceil(sr*dur);
  const buf=actx.createBuffer(1,bufLen,sr);
  const data=buf.getChannelData(0);
  // kalimba: fundamental with inharmonic tine partials
  const tinePartials=[
    {r:1.0,   a:0.65, d:2.2},
    {r:4.0,   a:0.22, d:0.8},  // tine second mode (2× the 2nd = unusual)
    {r:10.8,  a:0.08, d:0.3},  // high tine rattle
    {r:0.998, a:0.30, d:1.8},  // very slight detune for beating
  ].filter(p=>audible(freq,p.r,sr));
  // body resonance (warm box)
  const bodyFreq=freq*0.92;
  for(let i=0;i<bufLen;i++){
    let s=0;
    for(const p of tinePartials){
      const env=Math.exp(-i/(sr*p.d));
      s+=Math.sin(2*Math.PI*freq*p.r*i/sr)*p.a*env;
    }
    // body thump
    const body=Math.sin(2*Math.PI*bodyFreq*i/sr)*Math.exp(-i/(sr*0.18))*0.25;
    // sharp pluck transient
    const pluck=(Math.random()*2-1)*Math.exp(-i/(sr*0.003))*0.3;
    data[i]=(s+body+pluck)*0.55;
  }
  return buf;
}

// LASER — descending frequency sweep on sawtooth/triangle, sci-fi zap
function bakeLaser(freq,sr){
  const dur=1.8,bufLen=Math.ceil(sr*dur);
  const buf=actx.createBuffer(1,bufLen,sr);
  const data=buf.getChannelData(0);
  // Start 3 octaves above target, sweep down exponentially
  const startFreq=freq*8;
  const k=Math.log(startFreq/freq)/dur; // exponential decay constant
  let phase=0;
  for(let i=0;i<bufLen;i++){
    const t=i/sr;
    const f=startFreq*Math.exp(-k*t);
    phase+=2*Math.PI*f/sr;
    if(phase>2*Math.PI)phase-=2*Math.PI;
    // Mix sawtooth and triangle for that metallic laser character
    const saw=(phase/Math.PI)-1;
    const tri=Math.abs((phase/Math.PI)-1)*2-1;
    const env=Math.exp(-t*2.2);
    // Add slight ring mod shimmer
    const ring=Math.sin(2*Math.PI*freq*2.7*t);
    data[i]=(saw*0.6+tri*0.3+ring*0.1)*env*0.55;
  }
  return buf;
}

function bakeBuffer(inst,midi){
  const freq=440*Math.pow(2,(midi-69)/12);
  const sr=actx.sampleRate;
  if(inst==='harp')  return bakeHarp(freq,sr);
  if(inst==='bell')  return bakeBell(freq,sr);
  if(inst==='sine')  return bakeSine(freq,sr);
  if(inst==='bass')  return bakeBass(freq,sr);
  if(inst==='pad')   return bakePad(freq,sr);
  if(inst==='organ') return bakeOrgan(freq,sr);
  if(inst==='choir') return bakeChoir(freq,sr);
  if(inst==='cello') return bakeCello(freq,sr);
  if(inst==='wood')  return bakeWood(freq,sr);
  if(inst==='thumb') return bakeThumb(freq,sr);
  if(inst==='laser') return bakeLaser(freq,sr);
  return bakeHarp(freq,sr);
}

// ── NOTE CACHE ────────────────────────────────────────────────
// Each instrument+note is synthesised once and reused. The cache is capped
// (least-recently-used notes are dropped) so trying every instrument in
// every key can't run a phone out of memory.
const bufCache=new Map();
const CACHE_LIMIT_BYTES=96*1024*1024;
let cacheBytes=0;
function getBuffer(inst,midi){
  const key=inst+':'+midi;
  let buf=bufCache.get(key);
  if(buf){bufCache.delete(key);bufCache.set(key,buf);return buf;} // mark as recently used
  buf=bakeBuffer(inst,midi);
  bufCache.set(key,buf);cacheBytes+=buf.length*4;
  for(const [k,b] of bufCache){
    if(cacheBytes<=CACHE_LIMIT_BYTES)break;
    if(k===key)continue;
    bufCache.delete(k);cacheBytes-=b.length*4;
  }
  return buf;
}
// Synthesise the current chord's notes for the selected instruments in the
// background, a few at a time, so the first strum after a change doesn't stutter.
let prewarmQueue=[],prewarmTimer=null;
function prewarm(){
  if(!actx)return;
  prewarmQueue=[];
  const notes=[...new Set(state.ds)];
  for(const inst of state.insts)for(const m of notes)if(!bufCache.has(inst+':'+m))prewarmQueue.push([inst,m]);
  if(!prewarmTimer&&prewarmQueue.length)prewarmTimer=setTimeout(prewarmStep,30);
}
function prewarmStep(){
  prewarmTimer=null;
  const t0=performance.now();
  while(prewarmQueue.length&&performance.now()-t0<8){
    const [inst,m]=prewarmQueue.shift();
    if(!bufCache.has(inst+':'+m))getBuffer(inst,m);
  }
  if(prewarmQueue.length)prewarmTimer=setTimeout(prewarmStep,16);
}

// ── LOOPER ───────────────────────────────────────────────────
// Loop notes are queued on the audio clock a little ahead of time (rather
// than one timer per note), so loops stay in time, PLAY/STOP can't double
// notes up, and STOP silences anything already queued.
const LOOK_AHEAD=0.12;   // seconds of loop queued in advance
const looper={
  events:[],          // {t, midi, insts, velocity}, sorted by t (seconds into the loop)
  state:'stopped',    // 'stopped'|'armed'|'recording'|'playing'|'overdubbing'
  loopStart:0,        // audio time the recording / loop started (cycles are loopStart + k·loopLen)
  loopLen:0,
  cycleStart:0,idx:0, // where the scheduler has got to
  timer:null,overdubTimer:null,
  queued:[],          // {at, outs} for queued notes, so STOP can cut them
};

function setLooperState(s){
  looper.state=s;
  const rec=document.getElementById('lp-rec');
  const play=document.getElementById('lp-play');
  if(!rec||!play)return;
  rec.className ='lp-btn'+(s==='armed'?' rec-armed':s==='recording'||s==='overdubbing'?' rec-active':'');
  play.className='lp-btn'+(s==='playing'||s==='overdubbing'?' active':'');
}

function schedulerTick(){
  const ev=looper.events,len=looper.loopLen;
  if(!ev.length||!len)return;
  const now=actx.currentTime,horizon=now+LOOK_AHEAD;
  // Catch up if the page was in the background and whole loops went by
  if(looper.cycleStart+len<now){
    looper.cycleStart+=Math.floor((now-looper.cycleStart)/len)*len;looper.idx=0;
  }
  for(;;){
    if(looper.idx>=ev.length){looper.idx=0;looper.cycleStart+=len;}
    const e=ev[looper.idx],at=looper.cycleStart+e.t;
    if(at>horizon)break;
    if(at>=now-0.02){
      const vol=e.insts.length>1?1/Math.sqrt(e.insts.length):1;
      e.insts.forEach(inst=>looper.queued.push({at,outs:pluckInst(inst,e.midi,e.velocity,vol,at)}));
    }
    looper.idx++;
  }
  looper.queued=looper.queued.filter(q=>q.at>now);
}

function startPlayback(at){
  looper.loopStart=at;looper.cycleStart=at;looper.idx=0;
  clearInterval(looper.timer);
  looper.timer=setInterval(schedulerTick,25);
  schedulerTick();
}

function stopLooper(){
  clearInterval(looper.timer);looper.timer=null;
  clearTimeout(looper.overdubTimer);
  const now=actx?actx.currentTime:0;
  for(const q of looper.queued)if(q.at>now)q.outs.forEach(n=>n.disconnect());
  looper.queued=[];
  setLooperState('stopped');
}

function beginRecording(at){
  looper.events=[];
  looper.loopStart=at;
  looper.loopLen=0;
  setLooperState('recording');
}

function finishRecording(){
  const now=actx.currentTime;
  looper.loopLen=now-looper.loopStart;
  if(looper.loopLen<0.05){looper.events=[];looper.loopLen=0;stopLooper();return;}
  looper.events.forEach(e=>{e.t%=looper.loopLen;});
  looper.events.sort((a,b)=>a.t-b.t);
  setLooperState('playing');
  startPlayback(now);
}

function looperRecord(midi,velocity,when){
  if(looper.state==='armed')beginRecording(when);
  if(looper.state==='recording'){
    looper.events.push({midi,insts:[...state.insts],velocity,t:when-looper.loopStart});
  } else if(looper.state==='overdubbing'){
    const len=looper.loopLen;
    const t=(((when-looper.loopStart)%len)+len)%len;
    // Insert in time order. This note was just played live, so if it lands
    // before the scheduler's position, step past it (don't play it twice).
    const ev=looper.events;
    let i=ev.findIndex(x=>x.t>t);if(i<0)i=ev.length;
    ev.splice(i,0,{midi,insts:[...state.insts],velocity,t});
    if(i<=looper.idx)looper.idx++;
  }
}

document.getElementById('lp-rec').addEventListener('pointerup',e=>{
  e.stopPropagation();
  if(!actx)return;
  const s=looper.state;
  if(s==='stopped'){
    setLooperState('armed');                 // recording starts on the next note
  } else if(s==='playing'){
    // Overdub for exactly one loop, then back to playing
    clearTimeout(looper.overdubTimer);
    setLooperState('overdubbing');
    looper.overdubTimer=setTimeout(()=>{
      if(looper.state==='overdubbing')setLooperState('playing');
    },looper.loopLen*1000);
  } else if(s==='overdubbing'){
    clearTimeout(looper.overdubTimer);       // REC again = end overdub early
    setLooperState('playing');
  } else if(s==='armed'){
    setLooperState('stopped');
  } else if(s==='recording'){
    finishRecording();
  }
});

document.getElementById('lp-play').addEventListener('pointerup',e=>{
  e.stopPropagation();
  if(!actx)return;
  const s=looper.state;
  if(s==='recording'){
    finishRecording();
  } else if(s==='playing'||s==='overdubbing'){
    stopLooper();
  } else if(s==='stopped'&&looper.events.length&&looper.loopLen){
    setLooperState('playing');
    startPlayback(actx.currentTime+0.03);
  } else if(s==='armed'){
    setLooperState('stopped');
  }
});

document.getElementById('lp-clear').addEventListener('pointerup',e=>{
  e.stopPropagation();
  stopLooper();
  looper.events=[];
  looper.loopLen=0;
});

function startWaveform(){
  const canvas=document.getElementById('waveform-canvas');
  if(!canvas)return;
  function draw(){
    waveRaf=requestAnimationFrame(draw);
    const W=canvas.offsetWidth,H=canvas.offsetHeight;
    if(!W||!H)return;
    if(canvas.width!==W||canvas.height!==H){canvas.width=W;canvas.height=H;}
    const ctx=canvas.getContext('2d');
    const persistA=0.34-(scopeState.persist/100)*0.28;
    if(!analyser){
      ctx.fillStyle='#0a0a0a';
      ctx.fillRect(0,0,W,H);
      ctx.strokeStyle='rgba(0,255,204,0.12)';
      ctx.lineWidth=1;
      ctx.beginPath();
      ctx.moveTo(0,H/2);ctx.lineTo(W,H/2);
      ctx.stroke();
      return;
    }
    const fft=scopeFftFromTime(scopeState.time);
    if(analyser.fftSize!==fft)analyser.fftSize=fft;
    if(!scopeWaveBuf||scopeWaveBuf.length!==analyser.fftSize)scopeWaveBuf=new Float32Array(analyser.fftSize);
    analyser.getFloatTimeDomainData(scopeWaveBuf);
    const buf=scopeWaveBuf;
    const N=buf.length;
    let t0=0;
    for(let j=Math.floor(N*0.22);j<Math.floor(N*0.74)-1;j++){
      if(buf[j]<=0&&buf[j+1]>0){t0=j;break;}
    }
    ctx.fillStyle=`rgba(10,10,10,${persistA})`;
    ctx.fillRect(0,0,W,H);
    // Grid: 10 (x) by 8 (y) divisions
    const xDiv=10,yDiv=8;
    ctx.strokeStyle='rgba(0,255,204,0.055)';
    ctx.lineWidth=1;
    for(let gi=1;gi<xDiv;gi++){
      const x=(gi/xDiv)*W;
      ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
    }
    for(let gi=1;gi<yDiv;gi++){
      const y=(gi/yDiv)*H;
      ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
    }
    ctx.strokeStyle='rgba(0,255,204,0.09)';
    ctx.beginPath();
    ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);
    ctx.moveTo(0,H/2);ctx.lineTo(W,H/2);
    ctx.stroke();

    const g=0.22+(scopeState.gain/100)*1.28;
    const xyMix=scopeState.xy/100;
    const delay=Math.max(1,Math.floor((scopeState.xy/100)*(N-1)*0.46));

    let rms=0;
    for(let j=0;j<N;j++)rms+=buf[j]*buf[j];
    rms=Math.sqrt(rms/N);

    // Frequency estimate (rising zero-crossings)
    let hz=0;
    if(actx&&rms>0.006){
      let crossings=0;
      for(let j=1;j<N;j++){
        const a=buf[(t0+j-1)%N],b=buf[(t0+j)%N];
        if(a<=0&&b>0)crossings++;
      }
      const secs=N/actx.sampleRate;
      hz=crossings>0?(crossings/secs):0;
      if(hz<15||hz>8000)hz=0;
    }

    const bloom=2.5+rms*48;
    ctx.beginPath();
    ctx.strokeStyle=`rgba(0,255,204,${0.52+rms*0.38})`;
    ctx.lineWidth=1.2;
    ctx.shadowColor='rgba(0,255,204,0.42)';
    ctx.shadowBlur=bloom;
    for(let i=0;i<N;i++){
      const s=buf[(i+t0)%N];
      const sDly=buf[(i+t0+delay)%N];
      const xSweep=(i/Math.max(1,N-1))*W;
      const ySweep=H/2-s*g*H*0.41;
      const xXy=W/2+s*g*W*0.36;
      const yXy=H/2-sDly*g*H*0.36;
      const x=xSweep*(1-xyMix)+xXy*xyMix;
      const y=ySweep*(1-xyMix)+yXy*xyMix;
      if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.stroke();
    ctx.shadowBlur=0;

    // Hz readout (bottom-right)
    if(hz){
      ctx.save();
      ctx.font='7px -apple-system,Helvetica Neue,Arial,sans-serif';
      ctx.textAlign='right';
      ctx.textBaseline='alphabetic';
      ctx.fillStyle='rgba(255,179,71,0.78)';
      ctx.shadowColor='rgba(255,179,71,0.25)';
      ctx.shadowBlur=6;
      ctx.fillText(hz.toFixed(hz<100?1:0)+' Hz',W-4,H-4);
      ctx.restore();
    }
  }
  draw();
}

function initAudio(){
  // iPhone (iOS 17+): play even when the ring/silent switch is set to silent
  try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
  actx=new(window.AudioContext||window.webkitAudioContext)();
  actx.resume();

  // Safety limiter: a fast strum of many strings (plus FX) can add up past
  // full scale and crackle. Single notes stay below the threshold, untouched.
  limiter=actx.createDynamicsCompressor();
  limiter.threshold.value=-6;limiter.knee.value=6;limiter.ratio.value=12;
  limiter.attack.value=0.003;limiter.release.value=0.25;
  limiter.connect(actx.destination);
  master=actx.createGain();master.gain.value=0.80;
  master.connect(limiter);
  analyser=actx.createAnalyser();
  analyser.fftSize=scopeFftFromTime(scopeState.time);
  analyser.smoothingTimeConstant=0.45;
  limiter.connect(analyser);
  scopeWaveBuf=new Float32Array(analyser.fftSize);
  startWaveform();

  // Reverb IR
  const sr=actx.sampleRate,rl=Math.ceil(sr*2.4);
  const rbuf=actx.createBuffer(2,rl,sr);
  for(let c=0;c<2;c++){const d=rbuf.getChannelData(c);
    for(let i=0;i<rl;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/rl,2.0);}
  reverbConv=actx.createConvolver();reverbConv.buffer=rbuf;
  reverbSend=actx.createGain();reverbSend.gain.value=0.18;
  reverbSend.connect(reverbConv);reverbConv.connect(master);

  // Delay 180ms slapback
  delayNode=actx.createDelay(1.0);delayNode.delayTime.value=0.18;
  const fb=actx.createGain();fb.gain.value=0.28;
  delaySend=actx.createGain();delaySend.gain.value=0.0;
  delaySend.connect(delayNode);
  delayNode.connect(fb);fb.connect(delayNode);
  delayNode.connect(master);

  // Tape: modulated delay (wow/flutter) + HF rolloff + subtle saturation via WaveShaper
  tapeDelay=actx.createDelay(0.1);tapeDelay.delayTime.value=0.012;
  tapeLFO=actx.createOscillator();tapeLFO.type='sine';tapeLFO.frequency.value=0.6;
  tapeLFOGain=actx.createGain();tapeLFOGain.gain.value=0.0; // 0 = off
  tapeLFO.connect(tapeLFOGain);tapeLFOGain.connect(tapeDelay.delayTime);
  tapeLFO.start();
  tapeFilter=actx.createBiquadFilter();tapeFilter.type='lowpass';tapeFilter.frequency.value=20000;
  // soft-clip waveshaper for tape saturation
  const wsCurve=new Float32Array(256);
  for(let i=0;i<256;i++){const x=(i/128)-1;wsCurve[i]=Math.tanh(x);}
  const ws=actx.createWaveShaper();ws.curve=wsCurve;ws.oversample='2x';
  tapeSend=actx.createGain();tapeSend.gain.value=0.0;
  tapeSend.connect(tapeDelay);tapeDelay.connect(tapeFilter);tapeFilter.connect(ws);ws.connect(master);

  // Ping delay — 320ms, 50% feedback, longer echo
  pingDelay=actx.createDelay(1.0);pingDelay.delayTime.value=0.32;
  const pfb=actx.createGain();pfb.gain.value=0.5;
  pingSend=actx.createGain();pingSend.gain.value=0.0;
  pingSend.connect(pingDelay);pingDelay.connect(pfb);pfb.connect(pingDelay);pingDelay.connect(master);

  // Warble — slow LFO modulating a short delay line (chorus/vibrato shimmer)
  warbleDelay=actx.createDelay(0.05);warbleDelay.delayTime.value=0.01;
  warbleLFO=actx.createOscillator();warbleLFO.type='sine';warbleLFO.frequency.value=4.2;
  warbleLFOGain=actx.createGain();warbleLFOGain.gain.value=0.0;
  warbleLFO.connect(warbleLFOGain);warbleLFOGain.connect(warbleDelay.delayTime);warbleLFO.start();
  warbleSend=actx.createGain();warbleSend.gain.value=0.0;
  warbleSend.connect(warbleDelay);warbleDelay.connect(master);

  // Crush — bit-crusher via WaveShaper with variable resolution
  crushWS=actx.createWaveShaper();
  crushWS.oversample='none';
  crushSend=actx.createGain();crushSend.gain.value=0.0;
  crushSend.connect(crushWS);crushWS.connect(master);
  // Initial curve (full resolution = passthrough)
  _setCrushCurve(0);

  updateFX();
}

function _setCrushCurve(amt){
  if(!crushWS)return;
  const steps=Math.max(2,Math.round(256*(1-amt*0.98))); // amt=0 → 256 steps (clean), amt=1 → ~5 steps (crushed)
  const curve=new Float32Array(256);
  for(let i=0;i<256;i++){
    const x=(i/128)-1;
    curve[i]=Math.round(x*steps)/steps;
  }
  crushWS.curve=curve;
}

function updateFX(){
  if(!reverbSend)return;
  const now=actx.currentTime;
  const rv=fxState.verb/100;
  const dv=fxState.delay/100;
  const tv=fxState.tape/100;
  reverbSend.gain.setTargetAtTime(rv*0.6,now,0.02);
  delaySend.gain.setTargetAtTime(dv*0.45,now,0.02);
  if(pingSend)pingSend.gain.setTargetAtTime((fxState.ping/100)*0.5,now,0.02);
  if(warbleLFOGain){warbleLFOGain.gain.setTargetAtTime((fxState.warble/100)*0.006,now,0.05);}
  if(warbleSend)warbleSend.gain.setTargetAtTime((fxState.warble/100)*0.7,now,0.05);
  if(crushSend){crushSend.gain.setTargetAtTime((fxState.crush/100)*0.65,now,0.02);_setCrushCurve(fxState.crush/100);}
  // Tape: scale wobble depth and HF rolloff with knob
  tapeLFOGain.gain.setTargetAtTime(tv*0.003,now,0.05); // max 3ms wow
  tapeFilter.frequency.setTargetAtTime(20000-tv*16000,now,0.05); // 20kHz→4kHz rolloff
  tapeSend.gain.setTargetAtTime(tv*0.7,now,0.05);
}

// Play one note on one instrument at audio time `when` (now if omitted).
// Returns its output nodes so the looper can cut notes it has queued.
function pluckInst(inst,midi,velocity,volScale,when){
  const buf=getBuffer(inst,midi);
  const t=Math.max(when||0,actx.currentTime);
  const src=actx.createBufferSource();src.buffer=buf;
  const gain=actx.createGain();
  const gv=(0.20+velocity*0.34)*volScale;
  gain.gain.setValueAtTime(gv,t);
  gain.gain.exponentialRampToValueAtTime(0.0001,t+buf.duration);
  const outs=[gain];
  if(inst==='bass'){
    // sub-octave sine under the bass string
    const osc=actx.createOscillator();osc.type='sine';
    osc.frequency.value=440*Math.pow(2,(midi-69)/12)/2;
    const og=actx.createGain();og.gain.setValueAtTime(0.13*velocity*volScale,t);
    og.gain.exponentialRampToValueAtTime(0.0001,t+2.2);
    osc.connect(og);og.connect(master);osc.start(t);osc.stop(t+2.3);
    outs.push(og);
  }
  src.connect(gain);
  gain.connect(master);
  gain.connect(reverbSend);
  gain.connect(delaySend);
  gain.connect(pingSend);
  gain.connect(warbleSend);
  gain.connect(crushSend);
  gain.connect(tapeSend);
  src.start(t);src.stop(t+buf.duration+0.05);
  return outs;
}

// Play a note on every selected instrument, `delay` seconds from now
function pluck(midi,velocity,delay){
  if(!actx)return;
  const when=actx.currentTime+(delay||0);
  looperRecord(midi,velocity,when);
  const volScale=state.insts.size>1?(1/Math.sqrt(state.insts.size)):1;
  state.insts.forEach(inst=>pluckInst(inst,midi,velocity,volScale,when));
}

// ── STRUM ─────────────────────────────────────────────────────
const ptrs=new Map();
function rowY(cy){
  const b=document.getElementById('harp-board'),r=b.getBoundingClientRect();
  const NUM=state.vis.length;
  return Math.max(0,Math.min(NUM-1,Math.round(((cy-r.top)/r.height)*(NUM-1))));
}
function gmidi(i){const s=document.getElementById('S'+i);return s?parseInt(s.dataset.midi)||60:60;}
function strum(pid,cy){
  const idx=rowY(cy),now=performance.now(),p=ptrs.get(pid);if(!p)return;
  if(p.li===-1){
    // First touch: play the string under the finger
    const midi=gmidi(idx);
    flash(idx);
    pluck(midi,0.62);
    p.lastMidi=midi;
  } else if(idx!==p.li){
    // Sound every string crossed since the last move (not only the one the
    // finger landed on), spread over up to 30 ms: a fast swipe is a glissando.
    // Neighbouring lines that share a note only sound once.
    const dt=Math.max(1,now-p.lt),di=Math.abs(idx-p.li);
    const vel=Math.min(0.95,0.3+(di/dt)*14);
    const step=idx>p.li?1:-1,crossed=[];
    for(let j=p.li+step;j!==idx+step;j+=step){
      flash(j);
      const m=gmidi(j);
      if(m!==p.lastMidi){crossed.push(m);p.lastMidi=m;}
    }
    const gap=Math.min(dt,30)/1000/Math.max(1,crossed.length);
    crossed.forEach((m,k)=>pluck(m,vel,k*gap));
  }
  p.li=idx;p.lt=now;
}
function attachBoard(){
  const b=document.getElementById('harp-board');
  b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId,{li:-1,lt:0,lastMidi:-1});strum(e.pointerId,e.clientY);});
  b.addEventListener('pointermove',e=>{if(ptrs.has(e.pointerId))strum(e.pointerId,e.clientY);});
  b.addEventListener('pointerup',e=>ptrs.delete(e.pointerId));
  b.addEventListener('pointercancel',e=>ptrs.delete(e.pointerId));
}

// ── FX FADERS ────────────────────────────────────────────────
// ('tape' is the fader labelled TWANG)
const FADER_DEFS=[
  {id:'knob-verb',   fillId:'fader-fill-verb',   stateKey:'verb',   def:50},
  {id:'knob-delay',  fillId:'fader-fill-delay',  stateKey:'delay',  def:0},
  {id:'knob-ping',   fillId:'fader-fill-ping',   stateKey:'ping',   def:0},
  {id:'knob-warble', fillId:'fader-fill-warble', stateKey:'warble', def:0},
  {id:'knob-crush',  fillId:'fader-fill-crush',  stateKey:'crush',  def:0},
  {id:'knob-tape',   fillId:'fader-fill-tape',   stateKey:'tape',   def:0},
];
const fxState={verb:50,delay:0,ping:0,warble:0,crush:0,tape:0};

function initFaders(){
  FADER_DEFS.forEach(({id,fillId,stateKey,def})=>{
    const wrap=document.getElementById(id);
    if(!wrap)return;
    const fill=document.getElementById(fillId);
    const line=wrap.querySelector('.fader-line');
    const min=parseInt(wrap.dataset.min),max=parseInt(wrap.dataset.max);
    function set(val){
      const pct=((val-min)/(max-min)*100).toFixed(1)+'%';
      fill.style.width=pct;line.style.left=pct;
      fxState[stateKey]=val;
    }
    function valFromEvent(e){
      const rect=wrap.getBoundingClientRect();
      return min+(max-min)*Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width));
    }
    set(def);
    wrap.addEventListener('pointerdown',e=>{
      e.preventDefault();e.stopPropagation();
      wrap.setPointerCapture(e.pointerId);
      set(valFromEvent(e));updateFX();
    },{passive:false});
    wrap.addEventListener('pointermove',e=>{
      if(!wrap.hasPointerCapture(e.pointerId))return;
      e.preventDefault();e.stopPropagation();
      set(valFromEvent(e));updateFX();
    },{passive:false});
    wrap.addEventListener('pointerup',e=>wrap.releasePointerCapture(e.pointerId));
    wrap.addEventListener('pointercancel',e=>wrap.releasePointerCapture(e.pointerId));
  });
}

function initScopeKnobs(){
  document.querySelectorAll('.scope-dial[data-scope-key]').forEach(dial=>{
    const key=dial.dataset.scopeKey;
    let val=typeof scopeState[key]==='number'?scopeState[key]:50;
    scopeState[key]=val;
    function syncFft(){
      if(key!=='time'||!analyser)return;
      const f=scopeFftFromTime(val);
      if(analyser.fftSize!==f){
        analyser.fftSize=f;
        scopeWaveBuf=new Float32Array(f);
      }
    }
    function paintDial(){
      dial.style.setProperty('--scope-rot',(-135+(val/100)*270)+'deg');
      dial.dataset.val=String(Math.round(val));
      dial.setAttribute('aria-valuenow',String(Math.round(val)));
      scopeState[key]=val;
      syncFft();
    }
    paintDial();
    let lastAng=null;
    dial.addEventListener('pointerdown',e=>{
      e.preventDefault();e.stopPropagation();
      dial.setPointerCapture(e.pointerId);
      const r=dial.getBoundingClientRect();
      const cx=r.left+r.width/2,cy=r.top+r.height/2;
      lastAng=Math.atan2(e.clientY-cy,e.clientX-cx);
    },{passive:false});
    dial.addEventListener('pointermove',e=>{
      if(!dial.hasPointerCapture(e.pointerId))return;
      e.preventDefault();e.stopPropagation();
      const r=dial.getBoundingClientRect();
      const cx=r.left+r.width/2,cy=r.top+r.height/2;
      const ang=Math.atan2(e.clientY-cy,e.clientX-cx);
      let d=ang-lastAng;
      if(d>Math.PI)d-=2*Math.PI;
      if(d<-Math.PI)d+=2*Math.PI;
      lastAng=ang;
      val=Math.max(0,Math.min(100,val+(d/(2*Math.PI))*56));
      paintDial();
    },{passive:false});
    dial.addEventListener('pointerup',e=>{
      if(dial.hasPointerCapture(e.pointerId))dial.releasePointerCapture(e.pointerId);
    });
    dial.addEventListener('pointercancel',e=>{
      if(dial.hasPointerCapture(e.pointerId))dial.releasePointerCapture(e.pointerId);
    });
  });
}

function showSubs(){document.getElementById('sub-buttons').classList.add('visible');}
function hideSubs(){document.getElementById('sub-buttons').classList.remove('visible');
  document.querySelectorAll('[data-sub]').forEach(b=>b.classList.remove('active','sunken'));}
function activateChord(id){
  const subs=document.getElementById('sub-buttons');
  const keyRow=isKeyRow(id);
  // Tapping the selected C- / F- again folds the pattern buttons away
  if(!keyRow&&state.chord===id&&subs.classList.contains('visible')){hideSubs();state.mode='scale';applySet();return;}
  state.chord=id;state.mode='scale';
  document.querySelectorAll('[data-chord]').forEach(b=>b.classList.toggle('active',b.dataset.chord===id));
  document.querySelectorAll('[data-sub]').forEach(b=>b.classList.remove('active'));
  // The red patterns only apply to C- / F-: dim them (in place) for the coloured keys
  subs.classList.toggle('inactive',keyRow);
  if(!keyRow)showSubs();
  applySet();
}
function activateSub(id){
  if(isKeyRow(state.chord))return;
  state.mode=id;
  document.querySelectorAll('[data-sub]').forEach(b=>b.classList.toggle('active',b.dataset.sub===id));
  applySet();
}
document.querySelectorAll('[data-chord]').forEach(btn=>{

// ── UNLOCK ────────────────────────────────────────────────────
let unlocked=false;
function doUnlock(e){
  if(unlocked)return;
  unlocked=true;
  if(e&&e.cancelable)e.preventDefault();
  document.getElementById('unlock-overlay').style.display='none';
  document.getElementById('app').style.visibility='visible';
  state.chord='cmin';state.mode='scale';
  applySet();attachBoard();
  initFaders();
  initScopeKnobs();
  document.getElementById('btn-cmin').classList.add('active');
  showSubs();
  initAudio();
  prewarm();
  // Resume AudioContext after iOS rotation / interruption / tab switch
  const resumeAudio=()=>{if(actx&&actx.state!=='running')actx.resume();};
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)resumeAudio();});
  window.addEventListener('pageshow',resumeAudio);
  window.addEventListener('focus',resumeAudio);
  // ── AGGRESSIVE ZOOM/GESTURE LOCKDOWN ──
  const _vp='width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover';
  function resetViewport(){
    let mv=document.querySelector('meta[name=viewport]');
    if(!mv){mv=document.createElement('meta');mv.name='viewport';document.head.appendChild(mv);}
    mv.content=_vp;
  }

  // Block ALL touch events with 2+ fingers at document level
  // {passive:false} required so preventDefault() actually works
  function blockMulti(e){
    if(e.touches&&e.touches.length>1){ e.preventDefault(); e.stopImmediatePropagation(); }
  }
  function blockAll(e){ e.preventDefault(); e.stopImmediatePropagation(); }

  document.addEventListener('touchstart',   blockMulti, {passive:false,capture:true});
  document.addEventListener('touchmove',    blockAll,   {passive:false,capture:true});
  document.addEventListener('touchend',     blockMulti, {passive:false,capture:true});
  document.addEventListener('touchcancel',  blockMulti, {passive:false,capture:true});
  document.addEventListener('gesturestart', blockAll,   {passive:false,capture:true});
  document.addEventListener('gesturechange',blockAll,   {passive:false,capture:true});
  document.addEventListener('gestureend',   blockAll,   {passive:false,capture:true});

  // Kill any scroll attempts (Safari sometimes scrolls on 2-finger drag)
  document.addEventListener('scroll', e=>{ e.preventDefault(); window.scrollTo(0,0); },{passive:false});
  window.addEventListener('scroll',   e=>{ e.preventDefault(); window.scrollTo(0,0); },{passive:false});

  // Reset viewport on any resize or orientation change
  window.addEventListener('resize',           resetViewport);
  window.addEventListener('orientationchange',resetViewport);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden)resetViewport(); });

  // Nuclear: poll and reset viewport every 2s in case iOS sneaks a zoom
  setInterval(resetViewport, 2000);

  // Block dblclick (Safari's double-tap zoom trigger)
  document.addEventListener('dblclick', e=>e.preventDefault(), {passive:false, capture:true});

  // Track last tap to squash double-taps ourselves
  let _lastTap=0;
  document.addEventListener('touchend', e=>{
    const now=Date.now();
    if(now-_lastTap<350){ e.preventDefault(); e.stopImmediatePropagation(); }
    _lastTap=now;
  },{passive:false,capture:true});

  // Force scroll position lock
  document.body.style.overflow='hidden';
  document.documentElement.style.overflow='hidden';
  window.scrollTo(0,0);
}
const ub=document.getElementById('unlock-btn');
ub.addEventListener('click',doUnlock);
ub.addEventListener('pointerup',doUnlock);
ub.addEventListener('touchend',doUnlock);

// ── CRT EFFECT ───────────────────────────────────────────────
(function initCRT(){
  const canvas = document.getElementById('crt-overlay');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');

  let W=0, H=0;
  function resize(){
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // Flicker state
  let flickerVal   = 1.0;
  let flickerTarget = 1.0;
  let flickerTimer  = 0;

  // A handful of grain tiles made once, then cycled with random offsets
  // (much cheaper on phones than making fresh noise every other frame)
  const TILE = 256, NUM_TILES = 6, tiles = [];
  for(let t=0; t<NUM_TILES; t++){
    const c = document.createElement('canvas');
    c.width = c.height = TILE;
    const nCtx = c.getContext('2d');
    const id = nCtx.createImageData(TILE, TILE);
    const d  = id.data;
    for(let i=0; i<d.length; i+=4){
      const v = (Math.random() * 255)|0;
      d[i]=d[i+1]=d[i+2]=v;
      d[i+3] = (Math.random() * 38)|0; // alpha: max ~15% opacity
    }
    nCtx.putImageData(id, 0, 0);
    tiles.push(ctx.createPattern(c, 'repeat'));
  }
  let tile = tiles[0], tileX = 0, tileY = 0;

  let frame = 0;
  function draw(){
    requestAnimationFrame(draw);
    frame++;

    ctx.clearRect(0,0,W,H);

    // ── FLICKER ──
    // Drift toward target with some smoothing
    flickerVal += (flickerTarget - flickerVal) * 0.18;
    flickerTimer--;
    if(flickerTimer <= 0){
      // Occasional strong dip (phosphor flutter)
      const r = Math.random();
      if(r < 0.015){
        // Big flutter — quick brightness drop
        flickerTarget = 0.72 + Math.random() * 0.1;
        flickerTimer  = 2 + (Math.random() * 3)|0;
      } else if(r < 0.08){
        // Mild wobble
        flickerTarget = 0.88 + Math.random() * 0.1;
        flickerTimer  = 3 + (Math.random() * 5)|0;
      } else {
        // Normal — slight variation
        flickerTarget = 0.93 + Math.random() * 0.07;
        flickerTimer  = 8 + (Math.random() * 12)|0;
      }
    }

    // Apply flicker as a dark overlay
    const flicker_dark = 1.0 - flickerVal;
    if(flicker_dark > 0.01){
      ctx.fillStyle = `rgba(0,0,0,${(flicker_dark * 0.85).toFixed(3)})`;
      ctx.fillRect(0, 0, W, H);
    }

    // ── GRAIN ──
    // New grain every 2 frames: another tile at a random offset
    if(frame % 2 === 0){
      tile = tiles[(Math.random() * NUM_TILES)|0];
      tileX = (Math.random() * TILE)|0; tileY = (Math.random() * TILE)|0;
    }
    ctx.save();
    ctx.globalAlpha = 0.22 + Math.random() * 0.06; // vary grain intensity
    ctx.globalCompositeOperation = 'screen';
    ctx.translate(-tileX, -tileY);
    ctx.fillStyle = tile;
    ctx.fillRect(tileX, tileY, W, H);
    ctx.restore();

    // ── HORIZONTAL INTERFERENCE LINE (occasional) ──
    if(Math.random() < 0.04){
      const y   = (Math.random() * H)|0;
      const lh  = 1 + (Math.random() * 3)|0;
      const lop = 0.04 + Math.random() * 0.08;
      ctx.fillStyle = `rgba(255,255,255,${lop.toFixed(3)})`;
      ctx.fillRect(0, y, W, lh);
    }

    // ── SUBTLE RGB CHROMATIC BLEED (top edge of screen only) ──
    if(frame % 4 === 0){
      const gradH = 3 + (Math.random() * 4)|0;
      const grd = ctx.createLinearGradient(0,0,W,0);
      grd.addColorStop(0,   'rgba(255,0,0,0.03)');
      grd.addColorStop(0.33,'rgba(0,0,0,0)');
      grd.addColorStop(0.66,'rgba(0,0,0,0)');
      grd.addColorStop(1,   'rgba(0,0,255,0.03)');
      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, W, gradH);
    }
  }

  draw();
})();

</script>
