<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e9dec6">
<title>HarpMog</title>
<style>
:root{
  --font:"Futura","Avenir Next","Avenir","Century Gothic","Trebuchet MS",sans-serif;
  /* body of the instrument */
  --body:#e9dec6; --body-2:#ded0b2; --body-3:#d3c29f; --edge:#b7a37b; --edge-d:#8f7d58;
  --ink:#3a2d22; --ink-2:#6c5843; --ink-3:#9a866b;
  /* dark windows (strum plate, display, scope) */
  --win:#231d19; --win-2:#2f2722; --brass:#c9a25c; --brass-hi:#f3dca4;
  --lcd:#b9e07a; --lcd-dim:#5f7a3a;
  /* keys */
  --key:#f7f1e3; --key-shadow:#bfae8a;
  /* chord families */
  --maj:#e0a12a; --min:#3d8c87; --dom:#cf5428; --dim:#6d5a8f; --aug:#7f8b37;
  --fx:#cf5428;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;}
html,body{width:100%;height:100%;height:100dvh;overflow:hidden;touch-action:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;
  background:var(--body);color:var(--ink);font-family:var(--font);}
button{font-family:var(--font);color:inherit;}
[hidden]{display:none!important;}

/* ── APP FRAME ── */
#app{position:fixed;inset:0;width:100%;height:100%;height:100dvh;
  display:grid;gap:10px;
  grid-template-columns:minmax(0,1.5fr) minmax(0,.78fr) minmax(0,.72fr);
  grid-template-rows:auto minmax(0,1fr);
  grid-template-areas:"chords plate controls" "next plate controls";
  padding:max(env(safe-area-inset-top),12px) max(env(safe-area-inset-right),12px)
          max(env(safe-area-inset-bottom),12px) max(env(safe-area-inset-left),12px);
  background:
    radial-gradient(120% 90% at 30% 0%,rgba(255,255,255,.35),transparent 60%),
    linear-gradient(180deg,var(--body),var(--body-2));}
.panel{background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.08));
  border:1px solid var(--edge);border-radius:14px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -2px 0 rgba(0,0,0,.05),0 1px 0 rgba(255,255,255,.5);
  padding:10px;min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px;}
.panel-label{display:flex;align-items:baseline;gap:8px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);}
.panel-label .hint{font-weight:500;letter-spacing:.04em;text-transform:none;color:var(--ink-3);font-size:11px;}
#chord-panel{grid-area:chords;}
#next-panel{grid-area:next;overflow:hidden;}
#plate-panel{grid-area:plate;}
#controls-panel{grid-area:controls;overflow:hidden;}

/* ── CHORD GRID (omnichord style: roots in 4ths across, chord families down) ── */
#chord-grid{display:grid;grid-template-columns:minmax(46px,.9fr) repeat(12,minmax(0,1fr));gap:5px;}
.row-head{display:flex;flex-direction:column;justify-content:center;padding:0 6px;border-radius:8px;
  color:#fff;background:var(--fam);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18);min-width:0;}
.row-head b{font-size:12px;letter-spacing:.08em;line-height:1.1;}
.row-head small{font-size:10px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;}
.key{position:relative;height:40px;border:none;border-radius:8px;cursor:pointer;
  background:linear-gradient(180deg,#fffaf0,var(--key));
  box-shadow:0 3px 0 var(--key-shadow),0 4px 6px rgba(60,40,20,.18),inset 0 0 0 1px rgba(0,0,0,.06);
  font-size:13px;font-weight:600;color:var(--ink);
  display:flex;align-items:center;justify-content:center;transition:transform .05s,box-shadow .05s;}
.key::after{content:'';position:absolute;left:22%;right:22%;bottom:5px;height:3px;border-radius:2px;background:var(--fam);opacity:.55;}
.key.pressed{transform:translateY(2px);box-shadow:0 1px 0 var(--key-shadow),0 1px 2px rgba(60,40,20,.2),inset 0 0 0 1px rgba(0,0,0,.06);}
.key.active{background:var(--fam);color:#fff;transform:translateY(2px);
  box-shadow:0 1px 0 rgba(0,0,0,.25),inset 0 2px 4px rgba(0,0,0,.25);}
.key.active::after{background:#fff;opacity:.7;}

/* hold-for-extensions popover */
#var-pop{position:fixed;z-index:50;min-width:200px;max-width:min(360px,92vw);
  background:var(--key);border:1px solid var(--edge);border-radius:14px;padding:10px;
  box-shadow:0 14px 40px rgba(40,25,10,.35),0 2px 0 rgba(255,255,255,.7) inset;}
#var-pop .pop-title{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin:0 2px 8px;}
#var-pop .pop-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;}
#var-pop button{border:none;border-radius:8px;padding:9px 4px;font-size:14px;font-weight:600;cursor:pointer;
  background:#fff;box-shadow:0 2px 0 var(--key-shadow),inset 0 0 0 1px rgba(0,0,0,.07);color:var(--ink);white-space:nowrap;}
#var-pop button.hover,#var-pop button:active{background:var(--fam);color:#fff;}
#var-pop button.current{box-shadow:0 2px 0 var(--key-shadow),inset 0 0 0 2px var(--fam);}

/* ── WHERE NEXT ── */
#directions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;}
.dir{border:none;border-radius:10px;padding:6px 6px 5px;cursor:pointer;text-align:left;min-width:0;
  background:#fffaf0;box-shadow:0 2px 0 var(--key-shadow),inset 0 0 0 1px rgba(0,0,0,.06);
  display:flex;flex-direction:column;gap:1px;border-left:4px solid var(--fam);}
.dir b{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dir small{font-size:10px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em;}
.dir:active{transform:translateY(1px);box-shadow:0 1px 0 var(--key-shadow);}
.memory{display:flex;align-items:center;gap:6px;min-width:0;}
.memory .mini{flex:none;width:52px;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);}
.chips{display:flex;gap:5px;overflow:hidden;min-width:0;flex:1;}
.chip{flex:none;border:none;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer;
  background:#fffaf0;box-shadow:inset 0 0 0 1px var(--edge);color:var(--ink);border-left:3px solid var(--fam);}
.chips .empty{font-size:11px;color:var(--ink-3);padding:5px 2px;white-space:nowrap;}
#fav-btn{flex:none;border:none;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer;
  background:transparent;box-shadow:inset 0 0 0 1px var(--edge-d);color:var(--ink-2);}
#fav-btn.on{background:var(--maj);color:#fff;box-shadow:none;}

/* ── STRUM PLATE ── */
#plate-panel{display:flex;flex-direction:column;gap:8px;min-height:0;}
#display{background:var(--win);border-radius:10px;padding:8px 12px 7px;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.6);
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;min-width:0;}
#disp-chord{font-size:24px;font-weight:700;color:var(--lcd);text-shadow:0 0 10px rgba(185,224,122,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#disp-inst{font-size:10px;letter-spacing:.14em;color:var(--lcd-dim);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#harp-board{flex:1;min-height:0;position:relative;touch-action:none;
  background:
    linear-gradient(90deg,rgba(255,255,255,.04),transparent 18%,transparent 82%,rgba(255,255,255,.04)),
    linear-gradient(180deg,var(--win-2),var(--win));
  border-radius:12px;border:1px solid #14100d;
  box-shadow:inset 0 3px 10px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.6);
  display:flex;flex-direction:column;padding:8px 16px;overflow:hidden;}
#harp-board::before,#harp-board::after{content:'';position:absolute;top:6px;bottom:6px;width:6px;border-radius:3px;
  background:linear-gradient(90deg,#7d6234,var(--brass),#7d6234);opacity:.85;}
#harp-board::before{left:5px;} #harp-board::after{right:5px;}
.string-row{display:flex;align-items:center;flex:1;min-height:0;}
.string-line-wrap{flex:1;height:100%;position:relative;}
.string-line{position:absolute;top:50%;left:0;right:0;transform:translateY(-50%);pointer-events:none;border-radius:1px;}

/* ── CONTROLS ── */
#controls-panel{gap:10px;}
#inst-btns{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;}
.inst{height:34px;border:none;border-radius:8px;cursor:pointer;font-size:11px;font-weight:700;letter-spacing:.04em;
  background:linear-gradient(180deg,#fffaf0,var(--key));color:var(--ink-2);
  box-shadow:0 2px 0 var(--key-shadow),inset 0 0 0 1px rgba(0,0,0,.06);min-width:0;}
.inst.active{background:var(--ink);color:var(--body);box-shadow:0 1px 0 rgba(0,0,0,.3),inset 0 2px 3px rgba(0,0,0,.4);transform:translateY(1px);}
#fx-knobs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 8px;}
.fx-unit{min-width:0;display:flex;flex-direction:column;gap:3px;}
.fx-name{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);text-align:center;}
.fader-wrap{width:100%;height:24px;position:relative;cursor:pointer;touch-action:none;border-radius:12px;
  background:var(--body-3);box-shadow:inset 0 2px 3px rgba(0,0,0,.2),0 1px 0 rgba(255,255,255,.7);overflow:hidden;}
.fader-fill{position:absolute;top:0;left:0;bottom:0;width:0%;background:linear-gradient(90deg,rgba(207,84,40,.25),rgba(207,84,40,.6));pointer-events:none;}
.fader-line{position:absolute;top:2px;bottom:2px;width:14px;margin-left:-7px;left:0%;border-radius:8px;pointer-events:none;
  background:linear-gradient(180deg,#fffaf0,#d9cbad);box-shadow:0 1px 2px rgba(0,0,0,.35),inset 0 0 0 1px rgba(0,0,0,.12);}
#looper-panel{display:flex;gap:8px;align-items:stretch;margin-top:auto;}
#looper-transport{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;align-content:center;}
.lp-btn{height:38px;border:none;border-radius:8px;cursor:pointer;font-size:12px;font-weight:700;letter-spacing:.08em;
  background:linear-gradient(180deg,#fffaf0,var(--key));color:var(--ink);box-shadow:0 2px 0 var(--key-shadow),inset 0 0 0 1px rgba(0,0,0,.06);}
.lp-btn.active{background:var(--ink);color:var(--body);transform:translateY(1px);}
.lp-btn.rec-armed{color:var(--dom);animation:blink .7s infinite;}
.lp-btn.rec-active{background:var(--dom);color:#fff;transform:translateY(1px);}
.lp-clear{color:var(--ink-3);}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.35;}}
#led-panel{flex:none;width:84px;border-radius:8px;overflow:hidden;background:var(--win);box-shadow:inset 0 2px 5px rgba(0,0,0,.6);}
#scope-wrap{display:grid;grid-template-columns:1fr 18px;}
#waveform-canvas{display:block;width:100%;height:auto;aspect-ratio:1/1;}
#scope-side{display:flex;flex-direction:column;justify-content:space-evenly;align-items:center;background:rgba(0,0,0,.25);}
.scope-unit{display:flex;justify-content:center;}
.scope-dial{width:13px;height:13px;border-radius:50%;position:relative;cursor:pointer;touch-action:none;background:#3a302a;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);}
.scope-dial-ring{display:none;}
.scope-dial-pointer{position:absolute;left:50%;top:50%;width:1px;height:5px;margin-left:-.5px;margin-top:-5px;background:var(--lcd);
  transform-origin:50% 5px;transform:rotate(var(--scope-rot,-135deg));pointer-events:none;}
.scope-dial-name{display:none;}
#brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:12px;font-weight:700;letter-spacing:.2em;color:var(--ink-3);text-transform:uppercase;}
#brand a{color:var(--ink-3);text-decoration:none;letter-spacing:.1em;font-size:11px;}

/* ── START SCREEN ── */
#unlock-overlay{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:radial-gradient(100% 70% at 50% 30%,#f4ecd9,var(--body) 60%,var(--body-2));}
.ul-title{font-size:44px;font-weight:700;letter-spacing:.04em;color:var(--ink);}
.ul-title span{color:var(--dom);}
.ul-sub{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-2);}
.ul-stripes{display:flex;gap:6px;margin:2px 0 8px;}
.ul-stripes i{display:block;width:34px;height:6px;border-radius:3px;}
#unlock-btn{border:none;cursor:pointer;width:200px;height:56px;border-radius:14px;font-size:16px;font-weight:700;letter-spacing:.2em;
  background:var(--ink);color:var(--body);box-shadow:0 4px 0 #1c1510,0 10px 24px rgba(40,25,10,.25);}
#unlock-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1c1510;}
.back-link{position:fixed;z-index:101;top:max(env(safe-area-inset-top),10px);left:max(env(safe-area-inset-left),10px);padding:8px;
  font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);text-decoration:none;}

/* ── PHONES / TABLETS HELD UPRIGHT: chords on top, plate on the right ── */
@media (orientation:portrait),(max-width:700px){
  #app{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);
    grid-template-rows:auto auto minmax(0,1fr);
    grid-template-areas:"chords chords" "next plate" "controls plate";gap:8px;}
  #directions{grid-template-columns:repeat(2,minmax(0,1fr));}
  #chord-grid{grid-template-columns:minmax(40px,.95fr) repeat(12,minmax(0,1fr));gap:4px;}
  .key{height:38px;font-size:12px;}
}
@media (max-width:480px){
  #app{padding-left:max(env(safe-area-inset-left),8px);padding-right:max(env(safe-area-inset-right),8px);}
  .panel{padding:8px;border-radius:12px;}
  #chord-grid{gap:3px;grid-template-columns:38px repeat(12,minmax(0,1fr));}
  .key{height:36px;font-size:11px;border-radius:6px;}
  .row-head{padding:0 4px;} .row-head b{font-size:10px;} .row-head small{font-size:9px;}
  .panel-label .hint{display:none;}
  .dir b{font-size:13px;} .dir small{font-size:9px;}
  .memory .mini{width:40px;font-size:9px;}
  .inst{font-size:8px;height:28px;letter-spacing:0;border-radius:6px;}
  #inst-btns{gap:3px;}
  #controls-panel .panel-label{display:none;}
  #controls-panel{gap:8px;}
  #fx-knobs{gap:4px 6px;} .fader-wrap{height:20px;} .fx-name{font-size:8px;}
  .lp-btn{font-size:10px;height:32px;letter-spacing:0;}
  #led-panel,#brand{display:none;}
  #disp-chord{font-size:20px;}
}
/* short phones held upright (iPhone SE etc.) */
@media (orientation:portrait) and (max-height:740px){
  .key{height:30px;}
  #chord-panel,#next-panel{gap:5px;}
  .dir{padding:4px 5px;} .dir b{font-size:12px;}
  .dir:nth-child(n+7){display:none;}
}
/* ── PHONES HELD SIDEWAYS: tighter everything ── */
@media (orientation:landscape) and (max-height:560px){
  #app{gap:6px;padding:max(env(safe-area-inset-top),6px) max(env(safe-area-inset-right),8px)
       max(env(safe-area-inset-bottom),6px) max(env(safe-area-inset-left),8px);
       grid-template-columns:minmax(0,1.55fr) minmax(0,.8fr) minmax(0,.75fr);}
  .panel{padding:6px;gap:5px;border-radius:10px;}
  .panel-label{font-size:9px;} .panel-label .hint{font-size:9px;}
  #chord-grid{gap:3px;grid-template-columns:40px repeat(12,minmax(0,1fr));}
  .key{height:clamp(22px,7.4vh,34px);font-size:11px;border-radius:6px;}
  .key::after{bottom:3px;height:2px;}
  .row-head{padding:0 4px;border-radius:6px;} .row-head b{font-size:9px;} .row-head small{font-size:8px;}
  #directions{gap:4px;}
  .dir{padding:3px 5px;border-radius:8px;} .dir b{font-size:12px;} .dir small{font-size:8px;}
  .chip{padding:3px 8px;font-size:11px;} #fav-btn{padding:3px 8px;font-size:11px;}
  .memory .mini{width:42px;font-size:8px;}
  #display{padding:4px 8px;} #disp-chord{font-size:16px;}
  #controls-panel{gap:6px;}
  .inst{height:26px;font-size:8px;letter-spacing:0;}
  #inst-btns{gap:3px;}
  #fx-knobs{gap:3px 5px;} .fader-wrap{height:18px;} .fader-line{width:10px;margin-left:-5px;} .fx-name{font-size:7px;}
  .lp-btn{height:28px;font-size:10px;letter-spacing:.02em;}
  #led-panel{width:52px;} #scope-wrap{grid-template-columns:1fr;} #scope-side{display:none;}
  #brand{display:none;}
}
</style>
</head>
<body>
<div id="unlock-overlay">
  <a class="back-link site-back" href="javascript:history.back()" hidden>&#8249; back</a>
  <div class="ul-title">Harp<span>Mog</span></div>
  <div class="ul-stripes"><i style="background:var(--maj)"></i><i style="background:var(--min)"></i><i style="background:var(--dom)"></i><i style="background:var(--dim)"></i><i style="background:var(--aug)"></i></div>
  <div class="ul-sub">harmonic string instrument</div>
  <button id="unlock-btn">START</button>
</div>
<div id="app" style="visibility:hidden">
  <section id="chord-panel" class="panel">
    <div class="panel-label">Chords <span class="hint">tap to choose · hold for extensions</span></div>
    <div id="chord-grid"></div>
  </section>

  <section id="next-panel" class="panel">
    <div class="panel-label">Where next <span class="hint">from the chord you're on</span></div>
    <div id="directions"></div>
    <div class="memory"><span class="mini">Saved</span><div class="chips" id="favs"></div><button id="fav-btn">&#9734; Save</button></div>
    <div class="memory"><span class="mini">Recent</span><div class="chips" id="recents"></div></div>
  </section>

  <section id="plate-panel">
    <div id="display"><div id="disp-chord">C</div><div id="disp-inst">HARP</div></div>
    <div id="harp-board"></div>
  </section>

  <section id="controls-panel" class="panel">
    <div class="panel-label">Sound</div>
    <div id="inst-btns">
      <button class="inst active" data-inst="harp">HARP</button>
      <button class="inst" data-inst="bell">BELL</button>
      <button class="inst" data-inst="sine">SINE</button>
      <button class="inst" data-inst="bass">BASS</button>
      <button class="inst" data-inst="pad">PAD</button>
      <button class="inst" data-inst="organ">ORGAN</button>
      <button class="inst" data-inst="choir">CHOIR</button>
      <button class="inst" data-inst="cello">CELLO</button>
      <button class="inst" data-inst="wood">WOOD</button>
      <button class="inst" data-inst="thumb">THUMB</button>
    </div>
    <div class="panel-label">Effects</div>
    <div id="fx-knobs">
      <div class="fx-unit"><div class="fader-wrap" id="knob-verb" data-min="0" data-max="100"><div class="fader-fill" id="fader-fill-verb"></div><div class="fader-line"></div></div><div class="fx-name">reverb</div></div>
      <div class="fx-unit"><div class="fader-wrap" id="knob-delay" data-min="0" data-max="100"><div class="fader-fill" id="fader-fill-delay"></div><div class="fader-line"></div></div><div class="fx-name">delay</div></div>
      <div class="fx-unit"><div class="fader-wrap" id="knob-ping" data-min="0" data-max="100"><div class="fader-fill" id="fader-fill-ping"></div><div class="fader-line"></div></div><div class="fx-name">ping</div></div>
      <div class="fx-unit"><div class="fader-wrap" id="knob-warble" data-min="0" data-max="100"><div class="fader-fill" id="fader-fill-warble"></div><div class="fader-line"></div></div><div class="fx-name">warble</div></div>
      <div class="fx-unit"><div class="fader-wrap" id="knob-crush" data-min="0" data-max="100"><div class="fader-fill" id="fader-fill-crush"></div><div class="fader-line"></div></div><div class="fx-name">crush</div></div>
      <div class="fx-unit"><div class="fader-wrap" id="knob-tape" data-min="0" data-max="100"><div class="fader-fill" id="fader-fill-tape"></div><div class="fader-line"></div></div><div class="fx-name">twang</div></div>
    </div>
    <div id="looper-panel">
      <div id="looper-transport">
        <button class="lp-btn" id="lp-rec">REC</button>
        <button class="lp-btn" id="lp-play">PLAY</button>
        <button class="lp-btn lp-clear" id="lp-clear">CLR</button>
      </div>
      <div id="led-panel">
        <div id="scope-wrap">
          <canvas id="waveform-canvas"></canvas>
          <div id="scope-side">
            <div class="scope-unit"><div class="scope-dial" data-scope-key="time" role="slider" aria-label="Time base"><div class="scope-dial-ring"></div><div class="scope-dial-pointer"></div></div><div class="scope-dial-name">time</div></div>
            <div class="scope-unit"><div class="scope-dial" data-scope-key="gain" role="slider" aria-label="Scope gain"><div class="scope-dial-ring"></div><div class="scope-dial-pointer"></div></div><div class="scope-dial-name">gain</div></div>
            <div class="scope-unit"><div class="scope-dial" data-scope-key="persist" role="slider" aria-label="Phosphor persistence"><div class="scope-dial-ring"></div><div class="scope-dial-pointer"></div></div><div class="scope-dial-name">phos</div></div>
            <div class="scope-unit"><div class="scope-dial" data-scope-key="xy" role="slider" aria-label="X-Y mix"><div class="scope-dial-ring"></div><div class="scope-dial-pointer"></div></div><div class="scope-dial-name">x-y</div></div>
          </div>
        </div>
      </div>
    </div>
    <div id="brand"><span>HarpMog</span><a class="site-back" href="javascript:history.back()" hidden>&#8249; back</a></div>
  </section>
</div>
<div id="var-pop" hidden><div class="pop-title"></div><div class="pop-grid"></div></div>
<script>
(function(){
'use strict';

// ══ LEGACY CHORD SETS (C- / F-, red patterns, coloured key rows) ══
// Hidden for now while we try the omnichord-style system below. The data
// and voicing() are kept so they can be brought back. NN/NM/C2/C8/MAX_STRINGS
// are still used by the new system.
// ── NOTES ─────────────────────────────────────────────────────
const NN=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const NM={C:0,Db:1,D:2,Eb:3,E:4,F:5,Gb:6,G:7,Ab:8,A:9,Bb:10,B:11};
const C2=36,C8=108;      // MIDI range of the strings
const MAX_STRINGS=42;    // the board always draws 42 lines

// ── HOW A CHORD BECOMES STRINGS ──────────────────────────────
// A "cell" is an ordered list of note names, written low → high.
// voicing() walks it upward: the first note lands in octave 2 (C2–B2),
// and each next note is the nearest copy of that note ABOVE the one
// before. When the cell runs out it starts again from its first note;
// the walk stops at C8.
//   ['C','G','D','Eb'] → C2 G2 D3 Eb3 C4 G4 D5 Eb5 C6 …
// So the ORDER of the cell is the voicing: wide leaps spread the chord
// out, small steps keep it close. A long cell can reach C8 before it
// finishes, and notes after that point are never heard.
// The result (usually 12–25 notes) is spread across the 42 drawn
// strings, so neighbouring lines often share a note.
function voicing(cell){
  let last=C2+(NM[cell[0]]??0);
  const out=[last];
  for(let idx=1;;idx++){
    let m=Math.floor(last/12)*12+(NM[cell[idx%cell.length]]??0);
    if(m<=last)m+=12;
    if(m>C8)break;
    out.push(m);last=m;
  }
  return out.slice(0,MAX_STRINGS);
}
// SCALE mode: every note of the natural minor scale from C2 up (42 notes)
function minorScale(root){
  const iv=[0,2,3,5,7,8,10],rp=NM[root],out=[];
  for(let m=C2;m<=C8&&out.length<MAX_STRINGS;m++)if(iv.includes(((m-rp)%12+12)%12))out.push(m);
  return out;
}
function transpose(cell,semis){return cell.map(n=>NN[(NM[n]+semis+120)%12]);}

// ── C- / F- AND THE RED PATTERN BUTTONS ───────────────────────
// Patterns written in C minor; F- plays them a 4th higher.
const PATTERNS={
  base:   ['C','G','D','Eb','G','Bb','D','Eb','Bb','D','G','Bb','D','F'],
  deep:   ['C','G','D','Eb','Bb','F','D','G','C','D','G','Bb','Eb','F'],
  shimmer:['C','G','D','Eb','G','A','Bb','D','F','Bb','C','D','A','D','F','G','D','Eb','F','A'],
  blue:   ['C','F','Bb','Eb','G','C','F','Bb','D','F','Bb','Eb','G','C','F','Bb','D','F','G','C'],
  '45':   ['C','F','G','C','F','G','C','F','Bb','C','F','G','C','D','G','Bb','Eb','F','Bb','D','G','A','D','Eb','Ab','Bb','Eb','G','C','D','G','C','F','G','C'],
};
// Fixed chords: the same notes whether C- or F- is selected.
const FIXED_CHORDS={
  fminarp:['F','Ab','C','Eb','F','G','Ab','Bb','C','D','Eb','F','G','Bb','D','Eb','F','Ab','C','Eb','G','Ab'],
  copper: ['C','G','D','F','C','G','D','A','C','G','D','G','C','D','C','F','A'],
  darp:   ['D','G','A','D','G','A','D','G','A','D','G','A','D','G','A','D','G','A','D','G','A','D','G','A','D','G','A','D','G','A','D'],
  garp:   ['G','Bb','D','F','B','Bb','D','F','G','Bb','D','F','A','C','D','F','G','Bb','A','C','D','F'],
  bbarp:  ['Bb','D','F','A','Bb','D','Eb','F','A','C','E','G','A','Bb','D','F','G','G','A','A','Bb','C','D'],
  abmaj7: ['Ab','C','Eb','G','C','F','Bb','D','Eb','G','Ab','C','Eb','F','G','Bb','F','G','Bb'],
  ebmaj:  ['Eb','G','Bb','D','F','G','Bb','C','D','F','G','Bb','D','Eb','G','A','D','F','G','C','Eb','D'],
};
function chordSets(root,semis){
  const sets={scale:minorScale(root)};
  for(const k in PATTERNS)sets[k]=voicing(transpose(PATTERNS[k],semis));
  for(const k in FIXED_CHORDS)sets[k]=voicing(FIXED_CHORDS[k]);
  return sets;
}
const CHORDS={cmin:chordSets('C',0),fmin:chordSets('F',5)};

// ── THE FOUR COLOURED KEY ROWS ────────────────────────────────
// One cell per row, written in C, played in all 12 keys.
const KEY_ROWS={
  k45: {label:'45',     cell:PATTERNS['45']},                      // purple: the 45 pattern
  k5th:{label:'5TH',    cell:['C','F','Bb','Eb','G']},             // teal: stacked 4ths, then G
  kong:{label:'ORANGE', cell:['C','G','D','E','A','E','B']},       // orange: open major (add 9, 6, 7)
  kpnk:{label:'PINK',   cell:['C','G','D','Eb','Ab','G','B','D','F','G','Ab','B']}, // pink: minor with Ab and B
};
const KEYS=['c','db','d','eb','e','f','gb','g','ab','a','bb','b'];
const KEY_SETS={};
for(const row in KEY_ROWS)KEYS.forEach((k,i)=>{KEY_SETS[row+'_'+k]=voicing(transpose(KEY_ROWS[row].cell,i));});

// ══ NEW CHORD SYSTEM (omnichord-style) ═══════════════════════
// Roots run across in 4ths; chord families run down. Tap a key for that
// root in the row's current chord; hold a key for its extensions.
//
// Each chord is written as intervals (semitones above the root) in VOICING
// ORDER: the bass root sits in octave 2, then the list is walked upward,
// each note going to the nearest copy above the one before, repeating the
// list until the top. So the order spreads the chord: [7,4,11,2] on C gives
// C2 G2 E3 B3 D4 G4 E5 B5 D6 …  lv = how rich it is (0 triad … 3 lush/altered).
const ROOTS=[0,5,10,3,8,1,6,11,4,9,2,7];            // C F B♭ E♭ A♭ D♭ G♭ B E A D G
const PC_NAMES=['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];
const FAMILIES=[
  {id:'maj',name:'MAJ',color:'var(--maj)',vars:[
    {s:'',        iv:[7,4,0],      lv:0},
    {s:'sus2',    iv:[7,2,0],      lv:0},
    {s:'sus4',    iv:[7,5,0],      lv:0},
    {s:'add9',    iv:[7,2,4],      lv:1},
    {s:'6',       iv:[7,4,9,0],    lv:1},
    {s:'maj7',    iv:[7,4,11],     lv:1},
    {s:'6/9',     iv:[7,2,4,9],    lv:2},
    {s:'maj9',    iv:[7,4,11,2],   lv:2},
    {s:'maj7♯11', iv:[7,4,11,6],   lv:2},
    {s:'maj13',   iv:[11,4,9,2],   lv:3},
    {s:'maj9♯11', iv:[7,4,11,2,6], lv:3},
  ]},
  {id:'min',name:'MIN',color:'var(--min)',vars:[
    {s:'m',         iv:[7,3,0],       lv:0},
    {s:'m6',        iv:[7,3,9,0],     lv:1},
    {s:'m7',        iv:[7,3,10],      lv:1},
    {s:'m(maj7)',   iv:[7,3,11],      lv:1},
    {s:'m6/9',      iv:[7,2,3,9],     lv:2},
    {s:'m9',        iv:[10,3,7,2],    lv:2},
    {s:'m(maj9)',   iv:[11,3,7,2],    lv:2},
    {s:'m11',       iv:[10,3,7,2,5],  lv:3},
    {s:'m13',       iv:[10,3,9,2,5],  lv:3},
    {s:'m7 4ths',   iv:[5,10,3,7],    lv:3},
  ]},
  {id:'dom',name:'7',color:'var(--dom)',vars:[
    {s:'7',      iv:[10,4,7],      lv:1},
    {s:'7sus4',  iv:[10,5,7],      lv:1},
    {s:'9',      iv:[10,4,7,2],    lv:2},
    {s:'9sus4',  iv:[7,10,2,5],    lv:2},
    {s:'7♭9',    iv:[10,4,7,1],    lv:2},
    {s:'7♯9',    iv:[10,4,7,3],    lv:2},
    {s:'13',     iv:[10,4,9,2],    lv:3},
    {s:'13sus4', iv:[10,5,9,2],    lv:3},
    {s:'9♯11',   iv:[10,4,2,6],    lv:3},
    {s:'13♯11',  iv:[10,4,6,9,2],  lv:3},
    {s:'13♭9',   iv:[10,4,9,1],    lv:3},
    {s:'9♭13',   iv:[10,4,2,8],    lv:3},
    {s:'7alt',   iv:[10,4,8,1,3],  lv:3},
  ]},
  {id:'dim',name:'DIM',color:'var(--dim)',vars:[
    {s:'°',       iv:[6,3,0],      lv:0},
    {s:'°7',      iv:[6,3,9,0],    lv:1},
    {s:'ø',       iv:[6,10,3],     lv:1},
    {s:'ø9',      iv:[10,3,6,2],   lv:2},
    {s:'°(maj7)', iv:[6,3,11],     lv:2},
    {s:'ø11',     iv:[6,10,3,5],   lv:3},
    {s:'°7(9)',   iv:[6,3,9,2],    lv:3},
  ]},
  {id:'aug',name:'AUG',color:'var(--aug)',vars:[
    {s:'+',       iv:[8,4,0],      lv:0},
    {s:'+(add9)', iv:[8,2,4],      lv:1},
    {s:'+7',      iv:[10,4,8],     lv:1},
    {s:'maj7♯5',  iv:[11,4,8],     lv:1},
    {s:'9♯5',     iv:[10,4,8,2],   lv:2},
    {s:'maj9♯5',  iv:[11,4,8,2],   lv:3},
  ]},
];
const FAM=Object.fromEntries(FAMILIES.map(f=>[f.id,f]));
function findVar(fam,s){const i=FAM[fam].vars.findIndex(v=>v.s===s);return i<0?0:i;}
const rowVar={maj:0,min:0,dom:0,dim:0,aug:0};          // each row remembers its last extension
const VOICE_TOP=100;                                    // E7: the top string

function chordVar(c){return FAM[c.fam].vars[c.v];}
function chordName(c){return PC_NAMES[c.root]+chordVar(c).s;}
function chordKey(c){return c.root+':'+c.fam+':'+c.v;}
function chordNotes(c){
  const iv=chordVar(c).iv;
  let last=C2+c.root;const out=[last];
  for(let k=0;;k=(k+1)%iv.length){
    let m=Math.floor(last/12)*12+(c.root+iv[k])%12;
    if(m<=last)m+=12;
    if(m>VOICE_TOP)break;
    out.push(m);last=m;
  }
  return out;
}

// ── WHERE NEXT: labelled moves from the current chord ─────────
// Each move: semitones up from the current root, a family, and a "ladder"
// of extensions from plain to lush; the rung used matches how rich the
// current chord is, so a maj9 leads to m9 / 13 / maj9 rather than triads.
const LADDERS={
  maj:['maj',['','maj7','maj9','maj9♯11']],
  six:['maj',['6','6','6/9','6/9']],
  min:['min',['m','m7','m9','m11']],
  dom:['dom',['7','7','9','13']],
  alt:['dom',['7','7♭9','7♭9','7alt']],
  trit:['dom',['7','7','9♯11','13♯11']],
  sus:['dom',['7sus4','7sus4','9sus4','13sus4']],
  half:['dim',['ø','ø','ø9','ø11']],
  dim:['dim',['°','°7','°7','°7(9)']],
};
const MOVES={
  maj:[[5,'maj','to IV'],[2,'min','ii, heads to V'],[7,'dom','V7, back home'],[9,'min','vi, relative minor'],
       [9,'alt','VI7, pulls to ii'],[5,'min','iv, borrowed'],[10,'dom','♭VII7, backdoor'],[8,'maj','♭VI, borrowed']],
  min:[[5,'dom','V7 of ii–V'],[5,'min','to iv'],[7,'alt','V7, back to i'],[8,'maj','♭VI'],
       [3,'maj','♭III, relative major'],[10,'dom','♭VII7'],[2,'half','iiø, minor ii–V'],[10,'sus','sus, floating']],
  dom:[[5,'maj','resolve to I'],[5,'min','resolve to i'],[6,'trit','tritone sub'],[2,'min','deceptive vi'],
       [8,'maj','deceptive ♭VI'],[5,'dom','next in cycle of 4ths'],[7,'min','its ii, before it'],[0,'sus','sus it first']],
  half:[[5,'alt','V7, minor ii–V'],[10,'min','i, ii–V–i target'],[6,'maj','♭VI of the key'],[3,'min','iv of the key'],
        [0,'dim','°7 colour'],[1,'maj','up a half step']],
  dim:[[1,'maj','up a half step'],[1,'min','up a half step, minor'],[11,'alt','same notes as V7♭9'],
       [3,'dim','shift a minor 3rd'],[11,'min','down a half step'],[2,'dom','as a passing V']],
  aug:[[5,'maj','V+ to I'],[5,'min','V+ to i'],[0,'six','line cliché to 6'],[9,'min','to vi'],[4,'maj','up a major 3rd']],
};
function suggestions(c){
  const v=chordVar(c);
  const kind=c.fam==='dim'&&v.s.startsWith('ø')?'half':c.fam;
  return MOVES[kind].map(([d,lad,label])=>{
    const [fam,rungs]=LADDERS[lad];
    const s=rungs[Math.min(3,v.lv)];
    return {chord:{root:(c.root+d)%12,fam,v:findVar(fam,s)},label};
  });
}

// ── STATE / STRINGS ───────────────────────────────────────────
const state={chord:{root:0,fam:'maj',v:0},insts:new Set(['harp']),ds:[],vis:[]};
function applySet(){
  state.ds=chordNotes(state.chord).reverse();   // top string first
  state.vis=[];
  for(let i=0;i<MAX_STRINGS;i++){
    const ri=Math.round(i*(state.ds.length-1)/Math.max(1,MAX_STRINGS-1));
    state.vis.push(state.ds[ri]);
  }
  buildBoard();updateDisplay();prewarm();
}
function buildBoard(){
  const board=document.getElementById('harp-board');board.innerHTML='';
  const NUM=state.vis.length;
  for(let i=0;i<NUM;i++){
    const row=document.createElement('div');row.className='string-row';
    const wrap=document.createElement('div');wrap.className='string-line-wrap';
    const line=document.createElement('div');line.className='string-line';line.id='S'+i;
    line.dataset.midi=state.vis[i];
    // thicker (wound) strings at the bottom, a new note gets a brighter string
    const newNote=i===0||state.vis[i]!==state.vis[i-1];
    const thick=(0.8+(i/NUM)*1.6).toFixed(1);
    line.dataset.base=newNote?'rgba(214,176,104,.9)':'rgba(214,176,104,.32)';
    line.style.cssText=`height:${thick}px;background:${line.dataset.base};`;
    wrap.appendChild(line);row.appendChild(wrap);board.appendChild(row);
  }
}
function flash(i){
  const s=document.getElementById('S'+i);if(!s)return;
  s.style.background='#fff3cf';s.style.boxShadow='0 0 10px rgba(243,220,164,.95)';
  setTimeout(()=>{s.style.background=s.dataset.base;s.style.boxShadow='none';},160);
}
function updateDisplay(){
  document.getElementById('disp-chord').textContent=chordName(state.chord);
  document.getElementById('disp-inst').textContent=[...state.insts].join(' + ');
}

// ── CHORD GRID ────────────────────────────────────────────────
const HOLD_MS=320;
function buildGrid(){
  const g=document.getElementById('chord-grid');g.innerHTML='';
  for(const f of FAMILIES){
    const head=document.createElement('div');head.className='row-head';head.id='head-'+f.id;
    head.style.setProperty('--fam',f.color);
    g.appendChild(head);
    for(const r of ROOTS){
      const k=document.createElement('button');k.className='key';
      k.dataset.fam=f.id;k.dataset.root=r;k.textContent=PC_NAMES[r];
      k.style.setProperty('--fam',f.color);
      attachKey(k);g.appendChild(k);
    }
  }
  updateGrid();
}
function updateGrid(){
  for(const f of FAMILIES){
    const v=f.vars[rowVar[f.id]];
    document.getElementById('head-'+f.id).innerHTML=`<b>${f.name}</b><small>${v.s||'triad'}</small>`;
  }
  const c=state.chord;
  document.querySelectorAll('#chord-grid .key').forEach(k=>
    k.classList.toggle('active',k.dataset.fam===c.fam&&+k.dataset.root===c.root));
}
function selectChord(c,{setRow=false}={}){
  if(setRow)rowVar[c.fam]=c.v;
  state.chord={...c};
  applySet();updateGrid();renderNext();addRecent(c);
}
function attachKey(k){
  let timer=null,held=false;
  k.addEventListener('pointerdown',e=>{
    e.preventDefault();k.setPointerCapture(e.pointerId);k.classList.add('pressed');held=false;
    timer=setTimeout(()=>{held=true;openPop(k);},HOLD_MS);
  });
  k.addEventListener('pointermove',e=>{if(held)hoverPop(e.clientX,e.clientY);});
  k.addEventListener('pointerup',e=>{
    clearTimeout(timer);k.classList.remove('pressed');
    if(!held){selectChord({root:+k.dataset.root,fam:k.dataset.fam,v:rowVar[k.dataset.fam]});return;}
    // held: releasing over an extension picks it; releasing elsewhere leaves the list open to tap
    const b=popButtonAt(e.clientX,e.clientY);
    if(b)pickFromPop(b);
  });
  k.addEventListener('pointercancel',()=>{clearTimeout(timer);k.classList.remove('pressed');});
  k.addEventListener('contextmenu',e=>e.preventDefault());
}

// Hold-for-extensions list
const pop=document.getElementById('var-pop');
function openPop(k){
  const fam=FAM[k.dataset.fam],root=+k.dataset.root;
  pop.style.setProperty('--fam',fam.color);
  pop.querySelector('.pop-title').textContent=PC_NAMES[root]+' · '+{maj:'major',min:'minor',dom:'dominant 7',dim:'diminished',aug:'augmented'}[fam.id];
  const grid=pop.querySelector('.pop-grid');grid.innerHTML='';
  fam.vars.forEach((v,i)=>{
    const b=document.createElement('button');
    b.textContent=PC_NAMES[root]+v.s;b.dataset.root=root;b.dataset.fam=fam.id;b.dataset.v=i;
    if(state.chord.fam===fam.id&&state.chord.root===root&&state.chord.v===i)b.classList.add('current');
    b.addEventListener('pointerup',e=>{e.stopPropagation();pickFromPop(b);});
    grid.appendChild(b);
  });
  pop.hidden=false;
  // place it next to the key, kept on screen
  const r=k.getBoundingClientRect(),pw=pop.offsetWidth,ph=pop.offsetHeight,M=8;
  let x=r.left+r.width/2-pw/2,y=r.bottom+8;
  if(y+ph>innerHeight-M)y=r.top-ph-8;
  pop.style.left=Math.max(M,Math.min(innerWidth-pw-M,x))+'px';
  pop.style.top=Math.max(M,Math.min(innerHeight-ph-M,y))+'px';
}
function popButtonAt(x,y){return document.elementsFromPoint(x,y).find(el=>el.parentNode&&el.parentNode.classList&&el.parentNode.classList.contains('pop-grid'));}
function hoverPop(x,y){const b=popButtonAt(x,y);pop.querySelectorAll('button').forEach(el=>el.classList.toggle('hover',el===b));}
function pickFromPop(b){
  closePop();
  selectChord({root:+b.dataset.root,fam:b.dataset.fam,v:+b.dataset.v},{setRow:true});
}
function closePop(){pop.hidden=true;}
document.addEventListener('pointerdown',e=>{if(!pop.hidden&&!pop.contains(e.target))closePop();},true);

// ── WHERE NEXT + SAVED + RECENT ───────────────────────────────
function famColor(c){return FAM[c.fam].color;}
function renderNext(){
  const box=document.getElementById('directions');box.innerHTML='';
  for(const {chord,label} of suggestions(state.chord)){
    const b=document.createElement('button');b.className='dir';
    b.style.setProperty('--fam',famColor(chord));
    b.innerHTML=`<b>${chordName(chord)}</b><small>${label}</small>`;
    b.addEventListener('click',()=>selectChord(chord));
    box.appendChild(b);
  }
  renderMemory();
}
function loadList(k){try{const v=JSON.parse(localStorage.getItem(k)||'[]');return Array.isArray(v)?v.filter(c=>FAM[c.fam]&&FAM[c.fam].vars[c.v]):[];}catch(e){return[];}}
function saveList(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
let favs=loadList('harpmog.favs'),recents=loadList('harpmog.recents');
function addRecent(c){
  recents=[c,...recents.filter(r=>chordKey(r)!==chordKey(c))].slice(0,10);
  saveList('harpmog.recents',recents);renderMemory();
}
function renderChips(id,list,empty){
  const box=document.getElementById(id);box.innerHTML='';
  if(!list.length){box.innerHTML=`<span class="empty">${empty}</span>`;return;}
  for(const c of list){
    const b=document.createElement('button');b.className='chip';b.textContent=chordName(c);
    b.style.setProperty('--fam',famColor(c));
    b.addEventListener('click',()=>selectChord(c));
    box.appendChild(b);
  }
}
function renderMemory(){
  const cur=chordKey(state.chord);
  renderChips('favs',favs,'tap ☆ Save to keep a chord here');
  renderChips('recents',recents.filter(c=>chordKey(c)!==cur),'chords you play show up here');
  const on=favs.some(c=>chordKey(c)===cur);
  const fb=document.getElementById('fav-btn');fb.classList.toggle('on',on);fb.innerHTML=on?'&#9733; Saved':'&#9734; Save';
}
document.getElementById('fav-btn').addEventListener('click',()=>{
  const cur=chordKey(state.chord);
  favs=favs.some(c=>chordKey(c)===cur)?favs.filter(c=>chordKey(c)!==cur):[{...state.chord},...favs].slice(0,12);
  saveList('harpmog.favs',favs);renderMemory();
});

// ── AUDIO — pre-baked buffer cache, distinct synthesis per voice ─
let actx=null,master=null,reverbConv=null,reverbSend=null,delayNode=null,delaySend=null;
let analyser=null,waveRaf=null;
let scopeWaveBuf=null;
const scopeState={time:50,gain:55,persist:28,xy:18};
function scopeFftFromTime(t){
  const sizes=[512,1024,2048];
  return sizes[Math.min(2,Math.floor(Number(t)/34.001))];
}
let tapeDelay=null,tapeLFO=null,tapeLFOGain=null,tapeFilter=null,tapeSend=null;
let pingDelay=null,pingSend=null,warbleLFO=null,warbleLFOGain=null,warbleDelay=null,warbleSend=null,crushSend=null,crushWS=null;
let limiter=null;

// Karplus-Strong plucked string, shared by HARP and BASS.
// The loop is tuned with a fractional (allpass) delay so every string is
// in tune; a whole-sample delay line drifts sharp as notes get higher
// (it was ~10 cents sharp at middle C and up to 2–4 semitones in the top octave).
function bakeKS(freq,sr,dur,loss,lpHz){
  const D=sr/freq;                        // loop length needed, in samples
  const N=Math.max(2,Math.floor(D-0.6));  // whole samples (the averaging filter adds 0.5)
  const frac=D-0.5-N;                     // leftover fraction, 0.1–1.1 samples
  const w=2*Math.PI*freq/sr;
  const C=Math.sin((1-frac)*w/2)/Math.sin((1+frac)*w/2); // allpass coefficient for that delay
  const bufLen=Math.ceil(sr*dur);
  const buf=actx.createBuffer(1,bufLen,sr);
  const data=buf.getChannelData(0);
  const dl=new Float32Array(N);
  for(let i=0;i<N;i++)dl[i]=(Math.random()*2-1)*0.92;
  const alpha=lpHz/(lpHz+sr/(2*Math.PI));
  let ix=0,prev=0,apIn=0,apOut=0,lp=0;
  for(let i=0;i<bufLen;i++){
    const cur=dl[ix];
    const avg=loss*(cur+prev);prev=cur;
    const ap=C*avg+apIn-C*apOut;apIn=avg;apOut=ap;
    dl[ix]=ap;ix=(ix+1)%N;
    lp=alpha*ap+(1-alpha)*lp;data[i]=lp;
  }
  return buf;
}
// HARP — warm pluck
function bakeHarp(freq,sr){return bakeKS(freq,sr,2.8,0.4965,5500);}
// BASS — heavy low-pass, long decay
function bakeBass(freq,sr){return bakeKS(freq,sr,3.5,0.4952,1200);}
// Partials above ~Nyquist fold back as out-of-tune junk on high notes: skip them
function audible(freq,ratio,sr){return freq*ratio<sr*0.45;}

// BELL — additive harmonics with inharmonic partials, metallic shimmer
function bakeBell(freq,sr){
  const dur=3.5,bufLen=Math.ceil(sr*dur);
  const buf=actx.createBuffer(1,bufLen,sr);
  const data=buf.getChannelData(0);
  // bell partials: ratios and relative amplitudes (slightly inharmonic)
  const partials=[
    {r:1.0,  a:0.60, d:3.5},
    {r:2.756,a:0.25, d:1.8},
    {r:5.404,a:0.12, d:1.0},
    {r:8.933,a:0.06, d:0.6},
    {r:13.46,a:0.03, d:0.4},
  ];
  const parts=partials.filter(p=>audible(freq,p.r,sr));
  for(let i=0;i<bufLen;i++){
    let s=0;
    for(const p of parts){
      const env=Math.exp(-i/(sr*p.d));
      s+=Math.sin(2*Math.PI*freq*p.r*i/sr)*p.a*env;
    }
    data[i]=s*0.5;
  }
  return buf;
}

// SINE — pure sine with fast exponential decay, marimba-like
function bakeSine(freq,sr){
  const dur=1.6,bufLen=Math.ceil(sr*dur);
  const buf=actx.createBuffer(1,bufLen,sr);
  const data=buf.getChannelData(0);
  // fundamental + weak second harmonic for warmth
  for(let i=0;i<bufLen;i++){
    const t=i/sr;
    const env=Math.exp(-t*4.5);
    const env2=Math.exp(-t*8.0);
    data[i]=(Math.sin(2*Math.PI*freq*t)*env + Math.sin(2*Math.PI*freq*2*t)*0.18*env2)*0.7;
  }
  return buf;
}

// PAD — additive sines with slow attack baked in
function bakePad(freq,sr){
  const dur=4.0,bufLen=Math.ceil(sr*dur);
  const buf=actx.createBuffer(1,bufLen,sr);
  const data=buf.getChannelData(0);
  const attackSamples=Math.ceil(sr*0.08);
  const partials=[{r:1,a:0.55},{r:1.5,a:0.25},{r:2,a:0.12},{r:2.5,a:0.06},{r:3,a:0.03}].filter(p=>audible(freq,p.r,sr));
  for(let i=0;i<bufLen;i++){
    let s=0;
    for(const p of partials)s+=Math.sin(2*Math.PI*freq*p.r*i/sr)*p.a;
    const atk=Math.min(1,i/attackSamples);
    const dec=Math.exp(-i/(sr*3.8));
    data[i]=s*atk*dec*0.4;
  }
  return buf;
}

// ORGAN — Hammond-style: integer harmonics, no decay, steady drawbar mix
function bakeOrgan(freq,sr){
  const dur=2.5,bufLen=Math.ceil(sr*dur);
  const buf=actx.createBuffer(1,bufLen,sr);
  const data=buf.getChannelData(0);
  // drawbar harmonics: 16',8',4',2',1' + 2⅔',1⅗' (rotary shimmer via slow AM)
  const drawbars=[
    {r:0.5, a:0.20},{r:1,   a:0.70},{r:2,   a:0.50},
    {r:3,   a:0.12},{r:4,   a:0.35},{r:6,   a:0.08},
    {r:8,   a:0.20},{r:10,  a:0.04},{r:16,  a:0.08},
  ].filter(d=>audible(freq,d.r,sr));
  const rotaryHz=6.1; // Leslie cabinet rotation
  const atk=Math.ceil(sr*0.008);
  const rel=Math.ceil(sr*0.12);
  for(let i=0;i<bufLen;i++){
    let s=0;
    for(const d of drawbars)s+=Math.sin(2*Math.PI*freq*d.r*i/sr)*d.a;
    // rotary AM
    s*=1+0.18*Math.sin(2*Math.PI*rotaryHz*i/sr);
    // click attack + soft release
    const env=i<atk?(i/atk):(i>bufLen-rel?((bufLen-i)/rel):1);
    data[i]=s*env*0.18;
  }
  return buf;
}

// CHOIR — formant synthesis: two vowel formants (ah/oh) per note
function bakeChoir(freq,sr){
  // Optimised: all per-harmonic constants pre-computed outside sample loop
  // Inner loop is just sinf additions — no exp/formant math per sample
  const dur=3.0,bufLen=Math.ceil(sr*dur);
  const buf=actx.createBuffer(1,bufLen,sr);
  const data=buf.getChannelData(0);
  const formants=[
    {f:800,  bw:80,  g:1.0},
    {f:1200, bw:90,  g:0.7},
    {f:2500, bw:120, g:0.4},
    {f:3500, bw:200, g:0.15},
  ];
  // Pre-compute amplitude and phase-increment per harmonic
  const NUM_H=12;
  const phaseInc=new Float64Array(NUM_H);
  const amps=new Float64Array(NUM_H);
  for(let h=1;h<=NUM_H;h++){
    const hfreq=freq*h;
    let fgain=0;
    for(const fm of formants){
      const dist=hfreq-fm.f;
      fgain+=fm.g*Math.exp(-(dist*dist)/(2*fm.bw*fm.bw));
    }
    amps[h-1]=audible(freq,h,sr)?(1/h)*(fgain+0.05):0;
    phaseInc[h-1]=2*Math.PI*hfreq/sr;
  }
  // Running phase accumulators (avoid i*phaseInc which loses precision at large i)
  const phase=new Float64Array(NUM_H);
  const atk=Math.ceil(sr*0.10);
  const rel=Math.ceil(sr*0.25);
  const decayRate=1/(sr*2.8);
  for(let i=0;i<bufLen;i++){
    let s=0;
    for(let h=0;h<NUM_H;h++){
      s+=Math.sin(phase[h])*amps[h];
      phase[h]+=phaseInc[h];
    }
    const env=i<atk?(i/atk):(i>bufLen-rel?((bufLen-i)/rel):1);
    const breathEnv=Math.exp(-i*decayRate);
    data[i]=s*env*breathEnv*0.55;
  }
  return buf;
}


// CELLO — bowed string: sawtooth via additive with bow attack noise burst
function bakeCello(freq,sr){
  const dur=3.0,bufLen=Math.ceil(sr*dur);
  const buf=actx.createBuffer(1,bufLen,sr);
  const data=buf.getChannelData(0);
  const bowAtk=Math.ceil(sr*0.055);
  const harmonics=14;
  // Cello spectral envelope: strong 1st, dip at 2nd, peak at 3rd-4th
  const spectralEnv=[0,0.85,0.45,0.90,0.75,0.55,0.40,0.28,0.20,0.14,0.10,0.07,0.05,0.03,0.02];
  for(let i=0;i<bufLen;i++){
    const t=i/sr;
    let s=0;
    for(let h=1;h<=harmonics;h++){
      if(!audible(freq,h,sr))break;
      const amp=spectralEnv[h]||0;
      // slight odd/even asymmetry for bow character
      const phaseOdd=h%2===1?0:Math.PI*0.12;
      s+=Math.sin(2*Math.PI*freq*h*t+phaseOdd)*amp;
    }
    // bow attack: noise burst that fades into tone
    const bowNoise=(Math.random()*2-1)*Math.exp(-i/(sr*0.03));
    const bowAmt=Math.exp(-i/(bowAtk*0.7));
    const toneAmt=1-Math.exp(-i/(bowAtk*0.5));
    const bodyEnv=Math.exp(-t*1.1);
    data[i]=(s*toneAmt + bowNoise*bowAmt*0.5)*bodyEnv*0.32;
  }
  return buf;
}

// WOOD — log drum / woodblock: strong fundamental + 3rd harmonic + very fast noise attack
function bakeWood(freq,sr){
  const dur=1.2,bufLen=Math.ceil(sr*dur);
  const buf=actx.createBuffer(1,bufLen,sr);
  const data=buf.getChannelData(0);
  // hollow wood resonance: odd harmonics with specific envelope
  const partials=[
    {r:1.0, a:0.70, d:1.2},
    {r:2.76,a:0.20, d:0.4}, // slight inharmonicity for wood character
    {r:5.0, a:0.10, d:0.2},
  ].filter(p=>audible(freq,p.r,sr));
  for(let i=0;i<bufLen;i++){
    let s=0;
    for(const p of partials){
      const env=Math.exp(-i/(sr*p.d));
      s+=Math.sin(2*Math.PI*freq*p.r*i/sr)*p.a*env;
    }
    // sharp transient click
    const click=(Math.random()*2-1)*Math.exp(-i/(sr*0.004))*0.4;
    data[i]=(s+click)*0.6;
  }
  return buf;
}

// THUMB — kalimba/thumb piano: inharmonic tine + body resonance + metallic rattle partial
function bakeThumb(freq,sr){
  const dur=2.2,bufLen=Math.ceil(sr*dur);
  const buf=actx.createBuffer(1,bufLen,sr);
  const data=buf.getChannelData(0);
  // kalimba: fundamental with inharmonic tine partials
  const tinePartials=[
    {r:1.0,   a:0.65, d:2.2},
    {r:4.0,   a:0.22, d:0.8},  // tine second mode (2× the 2nd = unusual)
    {r:10.8,  a:0.08, d:0.3},  // high tine rattle
    {r:0.998, a:0.30, d:1.8},  // very slight detune for beating
  ].filter(p=>audible(freq,p.r,sr));
  // body resonance (warm box)
  const bodyFreq=freq*0.92;
  for(let i=0;i<bufLen;i++){
    let s=0;
    for(const p of tinePartials){
      const env=Math.exp(-i/(sr*p.d));
      s+=Math.sin(2*Math.PI*freq*p.r*i/sr)*p.a*env;
    }
    // body thump
    const body=Math.sin(2*Math.PI*bodyFreq*i/sr)*Math.exp(-i/(sr*0.18))*0.25;
    // sharp pluck transient
    const pluck=(Math.random()*2-1)*Math.exp(-i/(sr*0.003))*0.3;
    data[i]=(s+body+pluck)*0.55;
  }
  return buf;
}

function bakeBuffer(inst,midi){
  const freq=440*Math.pow(2,(midi-69)/12);
  const sr=actx.sampleRate;
  if(inst==='harp')  return bakeHarp(freq,sr);
  if(inst==='bell')  return bakeBell(freq,sr);
  if(inst==='sine')  return bakeSine(freq,sr);
  if(inst==='bass')  return bakeBass(freq,sr);
  if(inst==='pad')   return bakePad(freq,sr);
  if(inst==='organ') return bakeOrgan(freq,sr);
  if(inst==='choir') return bakeChoir(freq,sr);
  if(inst==='cello') return bakeCello(freq,sr);
  if(inst==='wood')  return bakeWood(freq,sr);
  if(inst==='thumb') return bakeThumb(freq,sr);
  return bakeHarp(freq,sr);
}

// ── NOTE CACHE ────────────────────────────────────────────────
// Each instrument+note is synthesised once and reused. The cache is capped
// (least-recently-used notes are dropped) so trying every instrument in
// every key can't run a phone out of memory.
const bufCache=new Map();
const CACHE_LIMIT_BYTES=96*1024*1024;
let cacheBytes=0;
function getBuffer(inst,midi){
  const key=inst+':'+midi;
  let buf=bufCache.get(key);
  if(buf){bufCache.delete(key);bufCache.set(key,buf);return buf;} // mark as recently used
  buf=bakeBuffer(inst,midi);
  bufCache.set(key,buf);cacheBytes+=buf.length*4;
  for(const [k,b] of bufCache){
    if(cacheBytes<=CACHE_LIMIT_BYTES)break;
    if(k===key)continue;
    bufCache.delete(k);cacheBytes-=b.length*4;
  }
  return buf;
}
// Synthesise the current chord's notes for the selected instruments in the
// background, a few at a time, so the first strum after a change doesn't stutter.
let prewarmQueue=[],prewarmTimer=null;
function prewarm(){
  if(!actx)return;
  prewarmQueue=[];
  const notes=[...new Set(state.ds)];
  for(const inst of state.insts)for(const m of notes)if(!bufCache.has(inst+':'+m))prewarmQueue.push([inst,m]);
  if(!prewarmTimer&&prewarmQueue.length)prewarmTimer=setTimeout(prewarmStep,30);
}
function prewarmStep(){
  prewarmTimer=null;
  const t0=performance.now();
  while(prewarmQueue.length&&performance.now()-t0<8){
    const [inst,m]=prewarmQueue.shift();
    if(!bufCache.has(inst+':'+m))getBuffer(inst,m);
  }
  if(prewarmQueue.length)prewarmTimer=setTimeout(prewarmStep,16);
}

// ── LOOPER ───────────────────────────────────────────────────
// Loop notes are queued on the audio clock a little ahead of time (rather
// than one timer per note), so loops stay in time, PLAY/STOP can't double
// notes up, and STOP silences anything already queued.
const LOOK_AHEAD=0.12;   // seconds of loop queued in advance
const looper={
  events:[],          // {t, midi, insts, velocity}, sorted by t (seconds into the loop)
  state:'stopped',    // 'stopped'|'armed'|'recording'|'playing'|'overdubbing'
  loopStart:0,        // audio time the recording / loop started (cycles are loopStart + k·loopLen)
  loopLen:0,
  cycleStart:0,idx:0, // where the scheduler has got to
  timer:null,overdubTimer:null,
  queued:[],          // {at, outs} for queued notes, so STOP can cut them
};

function setLooperState(s){
  looper.state=s;
  const rec=document.getElementById('lp-rec');
  const play=document.getElementById('lp-play');
  if(!rec||!play)return;
  rec.className ='lp-btn'+(s==='armed'?' rec-armed':s==='recording'||s==='overdubbing'?' rec-active':'');
  play.className='lp-btn'+(s==='playing'||s==='overdubbing'?' active':'');
}

function schedulerTick(){
  const ev=looper.events,len=looper.loopLen;
  if(!ev.length||!len)return;
  const now=actx.currentTime,horizon=now+LOOK_AHEAD;
  // Catch up if the page was in the background and whole loops went by
  if(looper.cycleStart+len<now){
    looper.cycleStart+=Math.floor((now-looper.cycleStart)/len)*len;looper.idx=0;
  }
  for(;;){
    if(looper.idx>=ev.length){looper.idx=0;looper.cycleStart+=len;}
    const e=ev[looper.idx],at=looper.cycleStart+e.t;
    if(at>horizon)break;
    if(at>=now-0.02){
      const vol=e.insts.length>1?1/Math.sqrt(e.insts.length):1;
      e.insts.forEach(inst=>looper.queued.push({at,outs:pluckInst(inst,e.midi,e.velocity,vol,at)}));
    }
    looper.idx++;
  }
  looper.queued=looper.queued.filter(q=>q.at>now);
}

function startPlayback(at){
  looper.loopStart=at;looper.cycleStart=at;looper.idx=0;
  clearInterval(looper.timer);
  looper.timer=setInterval(schedulerTick,25);
  schedulerTick();
}

function stopLooper(){
  clearInterval(looper.timer);looper.timer=null;
  clearTimeout(looper.overdubTimer);
  const now=actx?actx.currentTime:0;
  for(const q of looper.queued)if(q.at>now)q.outs.forEach(n=>n.disconnect());
  looper.queued=[];
  setLooperState('stopped');
}

function beginRecording(at){
  looper.events=[];
  looper.loopStart=at;
  looper.loopLen=0;
  setLooperState('recording');
}

function finishRecording(){
  const now=actx.currentTime;
  looper.loopLen=now-looper.loopStart;
  if(looper.loopLen<0.05){looper.events=[];looper.loopLen=0;stopLooper();return;}
  looper.events.forEach(e=>{e.t%=looper.loopLen;});
  looper.events.sort((a,b)=>a.t-b.t);
  setLooperState('playing');
  startPlayback(now);
}

function looperRecord(midi,velocity,when){
  if(looper.state==='armed')beginRecording(when);
  if(looper.state==='recording'){
    looper.events.push({midi,insts:[...state.insts],velocity,t:when-looper.loopStart});
  } else if(looper.state==='overdubbing'){
    const len=looper.loopLen;
    const t=(((when-looper.loopStart)%len)+len)%len;
    // Insert in time order. This note was just played live, so if it lands
    // before the scheduler's position, step past it (don't play it twice).
    const ev=looper.events;
    let i=ev.findIndex(x=>x.t>t);if(i<0)i=ev.length;
    ev.splice(i,0,{midi,insts:[...state.insts],velocity,t});
    if(i<=looper.idx)looper.idx++;
  }
}

document.getElementById('lp-rec').addEventListener('pointerup',e=>{
  e.stopPropagation();
  if(!actx)return;
  const s=looper.state;
  if(s==='stopped'){
    setLooperState('armed');                 // recording starts on the next note
  } else if(s==='playing'){
    // Overdub for exactly one loop, then back to playing
    clearTimeout(looper.overdubTimer);
    setLooperState('overdubbing');
    looper.overdubTimer=setTimeout(()=>{
      if(looper.state==='overdubbing')setLooperState('playing');
    },looper.loopLen*1000);
  } else if(s==='overdubbing'){
    clearTimeout(looper.overdubTimer);       // REC again = end overdub early
    setLooperState('playing');
  } else if(s==='armed'){
    setLooperState('stopped');
  } else if(s==='recording'){
    finishRecording();
  }
});

document.getElementById('lp-play').addEventListener('pointerup',e=>{
  e.stopPropagation();
  if(!actx)return;
  const s=looper.state;
  if(s==='recording'){
    finishRecording();
  } else if(s==='playing'||s==='overdubbing'){
    stopLooper();
  } else if(s==='stopped'&&looper.events.length&&looper.loopLen){
    setLooperState('playing');
    startPlayback(actx.currentTime+0.03);
  } else if(s==='armed'){
    setLooperState('stopped');
  }
});

document.getElementById('lp-clear').addEventListener('pointerup',e=>{
  e.stopPropagation();
  stopLooper();
  looper.events=[];
  looper.loopLen=0;
});

function startWaveform(){
  const canvas=document.getElementById('waveform-canvas');
  if(!canvas)return;
  function draw(){
    waveRaf=requestAnimationFrame(draw);
    const W=canvas.offsetWidth,H=canvas.offsetHeight;
    if(!W||!H)return;
    if(canvas.width!==W||canvas.height!==H){canvas.width=W;canvas.height=H;}
    const ctx=canvas.getContext('2d');
    const persistA=0.34-(scopeState.persist/100)*0.28;
    if(!analyser){
      ctx.fillStyle='#0a0a0a';
      ctx.fillRect(0,0,W,H);
      ctx.strokeStyle='rgba(0,255,204,0.12)';
      ctx.lineWidth=1;
      ctx.beginPath();
      ctx.moveTo(0,H/2);ctx.lineTo(W,H/2);
      ctx.stroke();
      return;
    }
    const fft=scopeFftFromTime(scopeState.time);
    if(analyser.fftSize!==fft)analyser.fftSize=fft;
    if(!scopeWaveBuf||scopeWaveBuf.length!==analyser.fftSize)scopeWaveBuf=new Float32Array(analyser.fftSize);
    analyser.getFloatTimeDomainData(scopeWaveBuf);
    const buf=scopeWaveBuf;
    const N=buf.length;
    let t0=0;
    for(let j=Math.floor(N*0.22);j<Math.floor(N*0.74)-1;j++){
      if(buf[j]<=0&&buf[j+1]>0){t0=j;break;}
    }
    ctx.fillStyle=`rgba(10,10,10,${persistA})`;
    ctx.fillRect(0,0,W,H);
    // Grid: 10 (x) by 8 (y) divisions
    const xDiv=10,yDiv=8;
    ctx.strokeStyle='rgba(0,255,204,0.055)';
    ctx.lineWidth=1;
    for(let gi=1;gi<xDiv;gi++){
      const x=(gi/xDiv)*W;
      ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
    }
    for(let gi=1;gi<yDiv;gi++){
      const y=(gi/yDiv)*H;
      ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
    }
    ctx.strokeStyle='rgba(0,255,204,0.09)';
    ctx.beginPath();
    ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);
    ctx.moveTo(0,H/2);ctx.lineTo(W,H/2);
    ctx.stroke();

    const g=0.22+(scopeState.gain/100)*1.28;
    const xyMix=scopeState.xy/100;
    const delay=Math.max(1,Math.floor((scopeState.xy/100)*(N-1)*0.46));

    let rms=0;
    for(let j=0;j<N;j++)rms+=buf[j]*buf[j];
    rms=Math.sqrt(rms/N);

    // Frequency estimate (rising zero-crossings)
    let hz=0;
    if(actx&&rms>0.006){
      let crossings=0;
      for(let j=1;j<N;j++){
        const a=buf[(t0+j-1)%N],b=buf[(t0+j)%N];
        if(a<=0&&b>0)crossings++;
      }
      const secs=N/actx.sampleRate;
      hz=crossings>0?(crossings/secs):0;
      if(hz<15||hz>8000)hz=0;
    }

    const bloom=2.5+rms*48;
    ctx.beginPath();
    ctx.strokeStyle=`rgba(0,255,204,${0.52+rms*0.38})`;
    ctx.lineWidth=1.2;
    ctx.shadowColor='rgba(0,255,204,0.42)';
    ctx.shadowBlur=bloom;
    for(let i=0;i<N;i++){
      const s=buf[(i+t0)%N];
      const sDly=buf[(i+t0+delay)%N];
      const xSweep=(i/Math.max(1,N-1))*W;
      const ySweep=H/2-s*g*H*0.41;
      const xXy=W/2+s*g*W*0.36;
      const yXy=H/2-sDly*g*H*0.36;
      const x=xSweep*(1-xyMix)+xXy*xyMix;
      const y=ySweep*(1-xyMix)+yXy*xyMix;
      if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.stroke();
    ctx.shadowBlur=0;

    // Hz readout (bottom-right)
    if(hz){
      ctx.save();
      ctx.font='7px -apple-system,Helvetica Neue,Arial,sans-serif';
      ctx.textAlign='right';
      ctx.textBaseline='alphabetic';
      ctx.fillStyle='rgba(255,179,71,0.78)';
      ctx.shadowColor='rgba(255,179,71,0.25)';
      ctx.shadowBlur=6;
      ctx.fillText(hz.toFixed(hz<100?1:0)+' Hz',W-4,H-4);
      ctx.restore();
    }
  }
  draw();
}

function initAudio(){
  // iPhone (iOS 17+): play even when the ring/silent switch is set to silent
  try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
  actx=new(window.AudioContext||window.webkitAudioContext)();
  actx.resume();

  // Safety limiter: a fast strum of many strings (plus FX) can add up past
  // full scale and crackle. Single notes stay below the threshold, untouched.
  limiter=actx.createDynamicsCompressor();
  limiter.threshold.value=-6;limiter.knee.value=6;limiter.ratio.value=12;
  limiter.attack.value=0.003;limiter.release.value=0.25;
  limiter.connect(actx.destination);
  master=actx.createGain();master.gain.value=0.80;
  master.connect(limiter);
  analyser=actx.createAnalyser();
  analyser.fftSize=scopeFftFromTime(scopeState.time);
  analyser.smoothingTimeConstant=0.45;
  limiter.connect(analyser);
  scopeWaveBuf=new Float32Array(analyser.fftSize);
  startWaveform();

  // Reverb IR
  const sr=actx.sampleRate,rl=Math.ceil(sr*2.4);
  const rbuf=actx.createBuffer(2,rl,sr);
  for(let c=0;c<2;c++){const d=rbuf.getChannelData(c);
    for(let i=0;i<rl;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/rl,2.0);}
  reverbConv=actx.createConvolver();reverbConv.buffer=rbuf;
  reverbSend=actx.createGain();reverbSend.gain.value=0.18;
  reverbSend.connect(reverbConv);reverbConv.connect(master);

  // Delay 180ms slapback
  delayNode=actx.createDelay(1.0);delayNode.delayTime.value=0.18;
  const fb=actx.createGain();fb.gain.value=0.28;
  delaySend=actx.createGain();delaySend.gain.value=0.0;
  delaySend.connect(delayNode);
  delayNode.connect(fb);fb.connect(delayNode);
  delayNode.connect(master);

  // Tape: modulated delay (wow/flutter) + HF rolloff + subtle saturation via WaveShaper
  tapeDelay=actx.createDelay(0.1);tapeDelay.delayTime.value=0.012;
  tapeLFO=actx.createOscillator();tapeLFO.type='sine';tapeLFO.frequency.value=0.6;
  tapeLFOGain=actx.createGain();tapeLFOGain.gain.value=0.0; // 0 = off
  tapeLFO.connect(tapeLFOGain);tapeLFOGain.connect(tapeDelay.delayTime);
  tapeLFO.start();
  tapeFilter=actx.createBiquadFilter();tapeFilter.type='lowpass';tapeFilter.frequency.value=20000;
  // soft-clip waveshaper for tape saturation
  const wsCurve=new Float32Array(256);
  for(let i=0;i<256;i++){const x=(i/128)-1;wsCurve[i]=Math.tanh(x);}
  const ws=actx.createWaveShaper();ws.curve=wsCurve;ws.oversample='2x';
  tapeSend=actx.createGain();tapeSend.gain.value=0.0;
  tapeSend.connect(tapeDelay);tapeDelay.connect(tapeFilter);tapeFilter.connect(ws);ws.connect(master);

  // Ping delay — 320ms, 50% feedback, longer echo
  pingDelay=actx.createDelay(1.0);pingDelay.delayTime.value=0.32;
  const pfb=actx.createGain();pfb.gain.value=0.5;
  pingSend=actx.createGain();pingSend.gain.value=0.0;
  pingSend.connect(pingDelay);pingDelay.connect(pfb);pfb.connect(pingDelay);pingDelay.connect(master);

  // Warble — slow LFO modulating a short delay line (chorus/vibrato shimmer)
  warbleDelay=actx.createDelay(0.05);warbleDelay.delayTime.value=0.01;
  warbleLFO=actx.createOscillator();warbleLFO.type='sine';warbleLFO.frequency.value=4.2;
  warbleLFOGain=actx.createGain();warbleLFOGain.gain.value=0.0;
  warbleLFO.connect(warbleLFOGain);warbleLFOGain.connect(warbleDelay.delayTime);warbleLFO.start();
  warbleSend=actx.createGain();warbleSend.gain.value=0.0;
  warbleSend.connect(warbleDelay);warbleDelay.connect(master);

  // Crush — bit-crusher via WaveShaper with variable resolution
  crushWS=actx.createWaveShaper();
  crushWS.oversample='none';
  crushSend=actx.createGain();crushSend.gain.value=0.0;
  crushSend.connect(crushWS);crushWS.connect(master);
  // Initial curve (full resolution = passthrough)
  _setCrushCurve(0);

  updateFX();
}

function _setCrushCurve(amt){
  if(!crushWS)return;
  const steps=Math.max(2,Math.round(256*(1-amt*0.98))); // amt=0 → 256 steps (clean), amt=1 → ~5 steps (crushed)
  const curve=new Float32Array(256);
  for(let i=0;i<256;i++){
    const x=(i/128)-1;
    curve[i]=Math.round(x*steps)/steps;
  }
  crushWS.curve=curve;
}

function updateFX(){
  if(!reverbSend)return;
  const now=actx.currentTime;
  const rv=fxState.verb/100;
  const dv=fxState.delay/100;
  const tv=fxState.tape/100;
  reverbSend.gain.setTargetAtTime(rv*0.6,now,0.02);
  delaySend.gain.setTargetAtTime(dv*0.45,now,0.02);
  if(pingSend)pingSend.gain.setTargetAtTime((fxState.ping/100)*0.5,now,0.02);
  if(warbleLFOGain){warbleLFOGain.gain.setTargetAtTime((fxState.warble/100)*0.006,now,0.05);}
  if(warbleSend)warbleSend.gain.setTargetAtTime((fxState.warble/100)*0.7,now,0.05);
  if(crushSend){crushSend.gain.setTargetAtTime((fxState.crush/100)*0.65,now,0.02);_setCrushCurve(fxState.crush/100);}
  // Tape: scale wobble depth and HF rolloff with knob
  tapeLFOGain.gain.setTargetAtTime(tv*0.003,now,0.05); // max 3ms wow
  tapeFilter.frequency.setTargetAtTime(20000-tv*16000,now,0.05); // 20kHz→4kHz rolloff
  tapeSend.gain.setTargetAtTime(tv*0.7,now,0.05);
}

// Play one note on one instrument at audio time `when` (now if omitted).
// Returns its output nodes so the looper can cut notes it has queued.
function pluckInst(inst,midi,velocity,volScale,when){
  const buf=getBuffer(inst,midi);
  const t=Math.max(when||0,actx.currentTime);
  const src=actx.createBufferSource();src.buffer=buf;
  const gain=actx.createGain();
  const gv=(0.20+velocity*0.34)*volScale;
  gain.gain.setValueAtTime(gv,t);
  gain.gain.exponentialRampToValueAtTime(0.0001,t+buf.duration);
  const outs=[gain];
  if(inst==='bass'){
    // sub-octave sine under the bass string
    const osc=actx.createOscillator();osc.type='sine';
    osc.frequency.value=440*Math.pow(2,(midi-69)/12)/2;
    const og=actx.createGain();og.gain.setValueAtTime(0.13*velocity*volScale,t);
    og.gain.exponentialRampToValueAtTime(0.0001,t+2.2);
    osc.connect(og);og.connect(master);osc.start(t);osc.stop(t+2.3);
    outs.push(og);
  }
  src.connect(gain);
  gain.connect(master);
  gain.connect(reverbSend);
  gain.connect(delaySend);
  gain.connect(pingSend);
  gain.connect(warbleSend);
  gain.connect(crushSend);
  gain.connect(tapeSend);
  src.start(t);src.stop(t+buf.duration+0.05);
  return outs;
}

// Play a note on every selected instrument, `delay` seconds from now
function pluck(midi,velocity,delay){
  if(!actx)return;
  const when=actx.currentTime+(delay||0);
  looperRecord(midi,velocity,when);
  const volScale=state.insts.size>1?(1/Math.sqrt(state.insts.size)):1;
  state.insts.forEach(inst=>pluckInst(inst,midi,velocity,volScale,when));
}

// ── STRUM ─────────────────────────────────────────────────────
const ptrs=new Map();
function rowY(cy){
  const b=document.getElementById('harp-board'),r=b.getBoundingClientRect();
  const NUM=state.vis.length;
  return Math.max(0,Math.min(NUM-1,Math.round(((cy-r.top)/r.height)*(NUM-1))));
}
function gmidi(i){const s=document.getElementById('S'+i);return s?parseInt(s.dataset.midi)||60:60;}
function strum(pid,cy){
  const idx=rowY(cy),now=performance.now(),p=ptrs.get(pid);if(!p)return;
  if(p.li===-1){
    // First touch: play the string under the finger
    const midi=gmidi(idx);
    flash(idx);
    pluck(midi,0.62);
    p.lastMidi=midi;
  } else if(idx!==p.li){
    // Sound every string crossed since the last move (not only the one the
    // finger landed on), spread over up to 30 ms: a fast swipe is a glissando.
    // Neighbouring lines that share a note only sound once.
    const dt=Math.max(1,now-p.lt),di=Math.abs(idx-p.li);
    const vel=Math.min(0.95,0.3+(di/dt)*14);
    const step=idx>p.li?1:-1,crossed=[];
    for(let j=p.li+step;j!==idx+step;j+=step){
      flash(j);
      const m=gmidi(j);
      if(m!==p.lastMidi){crossed.push(m);p.lastMidi=m;}
    }
    const gap=Math.min(dt,30)/1000/Math.max(1,crossed.length);
    crossed.forEach((m,k)=>pluck(m,vel,k*gap));
  }
  p.li=idx;p.lt=now;
}
function attachBoard(){
  const b=document.getElementById('harp-board');
  b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId,{li:-1,lt:0,lastMidi:-1});strum(e.pointerId,e.clientY);});
  b.addEventListener('pointermove',e=>{if(ptrs.has(e.pointerId))strum(e.pointerId,e.clientY);});
  b.addEventListener('pointerup',e=>ptrs.delete(e.pointerId));
  b.addEventListener('pointercancel',e=>ptrs.delete(e.pointerId));
}

// ── FX FADERS ────────────────────────────────────────────────
// ('tape' is the fader labelled TWANG)
const FADER_DEFS=[
  {id:'knob-verb',   fillId:'fader-fill-verb',   stateKey:'verb',   def:50},
  {id:'knob-delay',  fillId:'fader-fill-delay',  stateKey:'delay',  def:0},
  {id:'knob-ping',   fillId:'fader-fill-ping',   stateKey:'ping',   def:0},
  {id:'knob-warble', fillId:'fader-fill-warble', stateKey:'warble', def:0},
  {id:'knob-crush',  fillId:'fader-fill-crush',  stateKey:'crush',  def:0},
  {id:'knob-tape',   fillId:'fader-fill-tape',   stateKey:'tape',   def:0},
];
const fxState={verb:50,delay:0,ping:0,warble:0,crush:0,tape:0};

function initFaders(){
  FADER_DEFS.forEach(({id,fillId,stateKey,def})=>{
    const wrap=document.getElementById(id);
    if(!wrap)return;
    const fill=document.getElementById(fillId);
    const line=wrap.querySelector('.fader-line');
    const min=parseInt(wrap.dataset.min),max=parseInt(wrap.dataset.max);
    function set(val){
      const pct=((val-min)/(max-min)*100).toFixed(1)+'%';
      fill.style.width=pct;line.style.left=pct;
      fxState[stateKey]=val;
    }
    function valFromEvent(e){
      const rect=wrap.getBoundingClientRect();
      return min+(max-min)*Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width));
    }
    set(def);
    wrap.addEventListener('pointerdown',e=>{
      e.preventDefault();e.stopPropagation();
      wrap.setPointerCapture(e.pointerId);
      set(valFromEvent(e));updateFX();
    },{passive:false});
    wrap.addEventListener('pointermove',e=>{
      if(!wrap.hasPointerCapture(e.pointerId))return;
      e.preventDefault();e.stopPropagation();
      set(valFromEvent(e));updateFX();
    },{passive:false});
    wrap.addEventListener('pointerup',e=>wrap.releasePointerCapture(e.pointerId));
    wrap.addEventListener('pointercancel',e=>wrap.releasePointerCapture(e.pointerId));
  });
}

function initScopeKnobs(){
  document.querySelectorAll('.scope-dial[data-scope-key]').forEach(dial=>{
    const key=dial.dataset.scopeKey;
    let val=typeof scopeState[key]==='number'?scopeState[key]:50;
    scopeState[key]=val;
    function syncFft(){
      if(key!=='time'||!analyser)return;
      const f=scopeFftFromTime(val);
      if(analyser.fftSize!==f){
        analyser.fftSize=f;
        scopeWaveBuf=new Float32Array(f);
      }
    }
    function paintDial(){
      dial.style.setProperty('--scope-rot',(-135+(val/100)*270)+'deg');
      dial.dataset.val=String(Math.round(val));
      dial.setAttribute('aria-valuenow',String(Math.round(val)));
      scopeState[key]=val;
      syncFft();
    }
    paintDial();
    let lastAng=null;
    dial.addEventListener('pointerdown',e=>{
      e.preventDefault();e.stopPropagation();
      dial.setPointerCapture(e.pointerId);
      const r=dial.getBoundingClientRect();
      const cx=r.left+r.width/2,cy=r.top+r.height/2;
      lastAng=Math.atan2(e.clientY-cy,e.clientX-cx);
    },{passive:false});
    dial.addEventListener('pointermove',e=>{
      if(!dial.hasPointerCapture(e.pointerId))return;
      e.preventDefault();e.stopPropagation();
      const r=dial.getBoundingClientRect();
      const cx=r.left+r.width/2,cy=r.top+r.height/2;
      const ang=Math.atan2(e.clientY-cy,e.clientX-cx);
      let d=ang-lastAng;
      if(d>Math.PI)d-=2*Math.PI;
      if(d<-Math.PI)d+=2*Math.PI;
      lastAng=ang;
      val=Math.max(0,Math.min(100,val+(d/(2*Math.PI))*56));
      paintDial();
    },{passive:false});
    dial.addEventListener('pointerup',e=>{
      if(dial.hasPointerCapture(e.pointerId))dial.releasePointerCapture(e.pointerId);
    });
    dial.addEventListener('pointercancel',e=>{
      if(dial.hasPointerCapture(e.pointerId))dial.releasePointerCapture(e.pointerId);
    });
  });
}

// ── INSTRUMENT BUTTONS (tap to layer; at least one stays on) ──
document.querySelectorAll('.inst[data-inst]').forEach(btn=>{
  btn.addEventListener('pointerup',e=>{
    e.preventDefault();
    const inst=btn.dataset.inst;
    if(state.insts.has(inst)){
      if(state.insts.size>1){state.insts.delete(inst);btn.classList.remove('active');}
    } else {
      state.insts.add(inst);btn.classList.add('active');
    }
    updateDisplay();prewarm();
  });
});

// ── UNLOCK ────────────────────────────────────────────────────
let unlocked=false;
function doUnlock(e){
  if(unlocked)return;
  unlocked=true;
  if(e&&e.cancelable)e.preventDefault();
  document.getElementById('unlock-overlay').style.display='none';
  document.getElementById('app').style.visibility='visible';
  buildGrid();applySet();renderNext();attachBoard();
  initFaders();
  initScopeKnobs();
  initAudio();
  prewarm();
  // Resume AudioContext after iOS rotation / interruption / tab switch
  const resumeAudio=()=>{if(actx&&actx.state!=='running')actx.resume();};
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)resumeAudio();});
  window.addEventListener('pageshow',resumeAudio);
  window.addEventListener('focus',resumeAudio);
  // ── AGGRESSIVE ZOOM/GESTURE LOCKDOWN ──
  const _vp='width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover';
  function resetViewport(){
    let mv=document.querySelector('meta[name=viewport]');
    if(!mv){mv=document.createElement('meta');mv.name='viewport';document.head.appendChild(mv);}
    mv.content=_vp;
  }

  // Block ALL touch events with 2+ fingers at document level
  // {passive:false} required so preventDefault() actually works
  function blockMulti(e){
    if(e.touches&&e.touches.length>1){ e.preventDefault(); e.stopImmediatePropagation(); }
  }
  function blockAll(e){ e.preventDefault(); e.stopImmediatePropagation(); }

  document.addEventListener('touchstart',   blockMulti, {passive:false,capture:true});
  document.addEventListener('touchmove',    blockAll,   {passive:false,capture:true});
  document.addEventListener('touchend',     blockMulti, {passive:false,capture:true});
  document.addEventListener('touchcancel',  blockMulti, {passive:false,capture:true});
  document.addEventListener('gesturestart', blockAll,   {passive:false,capture:true});
  document.addEventListener('gesturechange',blockAll,   {passive:false,capture:true});
  document.addEventListener('gestureend',   blockAll,   {passive:false,capture:true});

  // Kill any scroll attempts (Safari sometimes scrolls on 2-finger drag)
  document.addEventListener('scroll', e=>{ e.preventDefault(); window.scrollTo(0,0); },{passive:false});
  window.addEventListener('scroll',   e=>{ e.preventDefault(); window.scrollTo(0,0); },{passive:false});

  // Reset viewport on any resize or orientation change
  window.addEventListener('resize',           resetViewport);
  window.addEventListener('orientationchange',resetViewport);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden)resetViewport(); });

  // Nuclear: poll and reset viewport every 2s in case iOS sneaks a zoom
  setInterval(resetViewport, 2000);

  // Block dblclick (Safari's double-tap zoom trigger)
  document.addEventListener('dblclick', e=>e.preventDefault(), {passive:false, capture:true});

  // Track last tap to squash double-taps ourselves
  let _lastTap=0;
  document.addEventListener('touchend', e=>{
    const now=Date.now();
    if(now-_lastTap<350){ e.preventDefault(); e.stopImmediatePropagation(); }
    _lastTap=now;
  },{passive:false,capture:true});

  // Force scroll position lock
  document.body.style.overflow='hidden';
  document.documentElement.style.overflow='hidden';
  window.scrollTo(0,0);
}
const ub=document.getElementById('unlock-btn');
ub.addEventListener('click',doUnlock);
ub.addEventListener('pointerup',doUnlock);
ub.addEventListener('touchend',doUnlock);

// Back links: only shown when you arrived from another page on the same site
// (e.g. theolebeaux.com/projects.html), hidden when HarpMog is opened on its own
try{
  if(document.referrer&&new URL(document.referrer).origin===location.origin)
    document.querySelectorAll('.site-back').forEach(a=>{a.hidden=false;});
}catch(e){}

})();
</script>
